   with Tremor data pieces (progress rings, tracker, category bar, bar list, spark area, stacked bars).
   Every screen is a 1440×900 frame, in light and dark.
   ====================================================================================================== */
/* ---------- tokens: light (default); dark by toggle or by the system ---------- */
:root {
  color-scheme: light;
  --background: #fafafa; --card: #ffffff; --foreground: #09090b; --muted: #f4f4f5; --muted-foreground: #63636b;
  --border: #e4e4e7; --input: #e4e4e7; --secondary: #f4f4f5; --subtle: #a1a1aa; --grid: #e4e4e7; --track: #f1f1f3;
  --overlay: rgb(9 9 11 / .35);
  /* state */
  --brand: #16a34a; --run: #16a34a; --run-ink: #15803d; --run-soft: #f0fdf4; --run-line: #bbf7d0;
  --you: #ea580c; --you-ink: #c2410c; --solid-you: #c2410c; --on-solid-you: #ffffff; --you-soft: #fff7ed; --you-line: #fed7aa;
  --warn: #d97706; --warn-ink: #b45309; --warn-soft: #fffbeb; --warn-line: #fde68a;
  --bad: #dc2626; --bad-ink: #b91c1c; --bad-soft: #fef2f2; --bad-line: #fecaca;
  /* activity: 4 hues validated vs #ffffff in this order; waiting on you is neutral, orange means "needs you now" */
  --c-think: #059669; --c-work: #2563eb; --c-cmd: #0891b2; --c-check: #c026d3; --c-you: #d4d4d8; --c-idle: #a1a1aa;
  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / .05); --shadow-lg: 0 16px 48px rgb(0 0 0 / .16);
  --glow-run: rgb(22 163 74 / .06); --glow-you: rgb(234 88 12 / .09); --glow-warn: rgb(217 119 6 / .08);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: #09090b; --card: #111113; --foreground: #fafafa; --muted: #1c1c1f; --muted-foreground: #a1a1aa;
  --border: #27272a; --input: #27272a; --secondary: #27272a; --subtle: #71717a; --grid: #232326; --track: #1f1f23;
  --overlay: rgb(0 0 0 / .6);
  --brand: #22c55e; --run: #22c55e; --run-ink: #4ade80; --run-soft: #052e16; --run-line: #14532d;
  --you: #f97316; --you-ink: #fb923c; --solid-you: #f97316; --on-solid-you: #1a0b04; --you-soft: #2a1306; --you-line: #7c2d12;
  --warn: #f59e0b; --warn-ink: #fbbf24; --warn-soft: #1f1606; --warn-line: #713f12;
  --bad: #ef4444; --bad-ink: #f87171; --bad-soft: #2a0f0f; --bad-line: #7f1d1d;
  /* activity: validated vs #09090b in this order */
  --c-think: #059669; --c-work: #2563eb; --c-cmd: #0891b2; --c-check: #d946ef; --c-you: #3f3f46; --c-idle: #52525b;
  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / .4); --shadow-lg: 0 16px 48px rgb(0 0 0 / .6);
  --glow-run: rgb(34 197 94 / .07); --glow-you: rgb(249 115 22 / .10); --glow-warn: rgb(245 158 11 / .08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  color-scheme: dark;
  --background: #09090b; --card: #111113; --foreground: #fafafa; --muted: #1c1c1f; --muted-foreground: #a1a1aa;
  --border: #27272a; --input: #27272a; --secondary: #27272a; --subtle: #71717a; --grid: #232326; --track: #1f1f23;
  --overlay: rgb(0 0 0 / .6);
  --brand: #22c55e; --run: #22c55e; --run-ink: #4ade80; --run-soft: #052e16; --run-line: #14532d;
  --you: #f97316; --you-ink: #fb923c; --solid-you: #f97316; --on-solid-you: #1a0b04; --you-soft: #2a1306; --you-line: #7c2d12;
  --warn: #f59e0b; --warn-ink: #fbbf24; --warn-soft: #1f1606; --warn-line: #713f12;
  --bad: #ef4444; --bad-ink: #f87171; --bad-soft: #2a0f0f; --bad-line: #7f1d1d;
  /* activity: validated vs #09090b in this order */
  --c-think: #059669; --c-work: #2563eb; --c-cmd: #0891b2; --c-check: #d946ef; --c-you: #3f3f46; --c-idle: #52525b;
  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / .4); --shadow-lg: 0 16px 48px rgb(0 0 0 / .6);
  --glow-run: rgb(34 197 94 / .07); --glow-you: rgb(249 115 22 / .10); --glow-warn: rgb(245 158 11 / .08);
  }
}
:root {
  --font: "Geist", ui-sans-serif, system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
  --fs-xs: 11.5px; --fs-sm: 12.5px; --fs: 13.5px; --fs-md: 14px; --fs-lg: 20px; --fs-xl: 26px; --fs-2xl: 30px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px;
  --radius: 10px; --radius-sm: 6px; --radius-md: 8px;
  --dur-fast: 120ms; --dur: 200ms; --dur-slow: 320ms; --ease: cubic-bezier(0.2, 0, 0, 1); --pulse: 1800ms;
}

/* ---------- page ---------- */
html, body { height: 100%; }
body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
#root { height: 100%; }
.app { height: 100%; background: var(--background); color: var(--foreground); display: flex; flex-direction: column; font-family: var(--font); font-size: var(--fs); line-height: 1.45; position: relative; --glow: var(--glow-run); }
.app.st-you { --glow: var(--glow-you); } .app.st-warn { --glow: var(--glow-warn); } .app.st-none { --glow: transparent; }
.app::before { content: ""; position: absolute; inset: 0 0 auto; height: 220px; background: radial-gradient(50% 100% at 50% 0, var(--glow), transparent); pointer-events: none; }
@keyframes brand { 50% { opacity: .45; } }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--run) 50%, transparent); } 70%, 100% { box-shadow: 0 0 0 6px transparent; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flow { to { stroke-dashoffset: -18; } }
@keyframes skp { 50% { opacity: .55; } }

/* Everything inside the page, except the views still on design v1 (.v1, below) until their units port them. */
@scope (.app) to (.v1) {
* { box-sizing: border-box; margin: 0; padding: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; color: inherit; background: none; border: 0; outline: 0; }

/* ---------- frame ---------- */
.num { font-variant-numeric: tabular-nums; }
.mf { color: var(--muted-foreground); }
code, .mono { font-family: var(--mono); font-size: 12px; }

/* ---------- top bar ---------- */
.top { height: 56px; display: flex; align-items: center; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; position: relative; z-index: 2; background: var(--background); }
.logo { font: 700 19px var(--font); letter-spacing: -.04em; margin-right: 18px; display: flex; align-items: center; }
.logo i { font-style: normal; color: var(--brand); }
.logo.off i { color: var(--muted-foreground); }
.logo:not(.off) i { animation: brand var(--pulse) var(--ease) infinite; }
.stab { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: var(--radius-md); font-size: var(--fs); font-weight: 500; color: var(--muted-foreground); max-width: 230px; white-space: nowrap; transition: background var(--dur-fast) var(--ease); }
.stab .t { overflow: hidden; text-overflow: ellipsis; }
.stab:hover { background: var(--muted); color: var(--foreground); }
.stab.on { background: var(--secondary); color: var(--foreground); }
.spacer { margin-left: auto; }
.sep { width: 1px; height: 20px; background: var(--border); margin: 0 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--run); flex-shrink: 0; display: inline-block; }
.dot.idle { background: transparent; box-shadow: inset 0 0 0 1.5px var(--subtle); }
.dot.you { background: var(--you); } .dot.warn { background: var(--warn); } .dot.grey { background: var(--subtle); }
.dot.live { animation: ping var(--pulse) var(--ease) infinite; }
@media (prefers-reduced-motion: reduce) { .dot.live, .spin, .flow, .logo i { animation: none !important; } }

/* ---------- shadcn primitives ---------- */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-xs); min-width: 0; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; border: 1px solid var(--border); color: var(--foreground); white-space: nowrap; }
.badge.run { background: var(--run-soft); border-color: var(--run-line); color: var(--run-ink); }
.badge.you { background: var(--you-soft); border-color: var(--you-line); color: var(--you-ink); }
.badge.warn { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn-ink); }
.badge.bad { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad-ink); }
.badge.solid-you { background: var(--solid-you); border-color: var(--solid-you); color: var(--on-solid-you); font-weight: 600; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; white-space: nowrap; transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease); }
.btn.out { border: 1px solid var(--input); background: var(--card); box-shadow: var(--shadow-xs); }
.btn.out:hover { background: var(--muted); }
.btn.ghost { color: var(--muted-foreground); }
.btn.ghost:hover { background: var(--muted); color: var(--foreground); }
.btn.primary { background: var(--foreground); color: var(--background); }
.btn.icon { width: 32px; padding: 0; }
.tabs { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--muted); }
.tabs button { height: 28px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; color: var(--muted-foreground); }
.tabs button.on { background: var(--card); color: var(--foreground); box-shadow: var(--shadow-xs); }
.kbd { font-family: var(--mono); font-size: 11px; height: 20px; min-width: 20px; padding: 0 5px; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; border: 1px solid var(--border); background: var(--muted); color: var(--muted-foreground); }
.alert { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--warn-line); background: var(--warn-soft); position: relative; z-index: 1; flex-shrink: 0; }
.alert.grey { border-color: var(--border); background: var(--muted); }
.alert .at { font-weight: 600; } .alert .ad { color: var(--muted-foreground); font-size: 13px; }
.alert .btn { margin-left: auto; }
.alert svg.ic { color: var(--warn); flex-shrink: 0; }
.alert.grey svg.ic { color: var(--muted-foreground); }

/* ---------- layout ---------- */
.main { flex: 1; min-height: 0; padding: 20px 24px 0; display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 1; }
.main.dim > :not(.foot-bar) { opacity: .55; filter: saturate(.6); }
.head { display: flex; align-items: center; gap: 12px; min-height: 32px; }
.head h1 { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.02em; white-space: nowrap; }
.head .meta { color: var(--muted-foreground); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head .r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.crumb { display: flex; align-items: center; gap: 6px; color: var(--muted-foreground); font-size: 13px; }
.ch { display: flex; align-items: center; gap: 8px; min-height: 24px; }
.ch h3 { font-size: var(--fs-md); font-weight: 500; white-space: nowrap; }
.ch .r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.desc { color: var(--muted-foreground); font-size: 13px; }
.grid { display: grid; gap: 16px; min-height: 0; }
.pad { padding: 18px 20px; }
.col { display: flex; flex-direction: column; min-height: 0; }

/* status card */
.status { padding: 20px; display: grid; grid-template-columns: 170px 1fr; gap: 22px; align-items: center; }
.status.wide { grid-template-columns: 170px 1fr auto; }
.status .big { font-size: var(--fs-2xl); font-weight: 600; letter-spacing: -.03em; line-height: 1.12; margin-top: 10px; }
.status .big.md { font-size: var(--fs-xl); }
.status.you { border-color: var(--you-line); box-shadow: 0 0 0 3px color-mix(in srgb, var(--you) 10%, transparent); }
.timer { font-family: var(--mono); font-size: 13px; color: var(--muted-foreground); }
.timer.lg { font-size: 34px; font-family: var(--font); font-weight: 500; letter-spacing: -.02em; color: var(--foreground); }
.leg { display: flex; flex-direction: column; gap: 9px; margin-top: 16px; font-size: 13px; max-width: 300px; }
.leg > div { display: flex; align-items: center; gap: 8px; }
.leg i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.leg b { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
.answer { border: 1px dashed var(--you-line); background: var(--you-soft); border-radius: var(--radius-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 330px; }
.answer code { color: var(--foreground); }

/* job graph */
.jn { position: absolute; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: var(--radius-md); background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-xs); font-size: 13px; font-weight: 500; white-space: nowrap; text-align: left; transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
button.jn:hover { border-color: var(--subtle); box-shadow: var(--shadow-lg); }
.jn .nm { overflow: hidden; text-overflow: ellipsis; }
.jn .d { margin-left: auto; color: var(--muted-foreground); font-family: var(--mono); font-size: 11.5px; font-weight: 400; }
.jn.run { border-color: var(--run-line); }
.jn.root { height: 42px; padding: 0 12px; border-color: var(--run-line); box-shadow: 0 0 0 3px color-mix(in srgb, var(--run) 12%, transparent); }
.jn.fail { border-color: var(--bad-line); }
.ck { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: var(--run-soft); color: var(--run-ink); flex-shrink: 0; }
.ck.bad { background: var(--bad-soft); color: var(--bad-ink); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--run) 25%, transparent); border-top-color: var(--run); animation: spin 1s linear infinite; flex-shrink: 0; }
.flow { animation: flow .9s linear infinite; }

/* KPI cards */
.kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.kpi .v { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -.03em; line-height: 1.15; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.kpi .v small { font-size: var(--fs-md); font-weight: 500; color: var(--muted-foreground); letter-spacing: 0; }
.kpi .foot { margin-top: auto; padding-top: 10px; }
.tracker { display: flex; gap: 3px; height: 28px; }
.tracker i { flex: 1; border-radius: 3px; background: var(--track); }
.tracker.sm { height: 22px; }
.catbar { display: flex; gap: 3px; height: 8px; }
.catbar i { border-radius: 2px; min-width: 3px; }
.prog { height: 8px; border-radius: 4px; background: var(--track); position: relative; }
.prog i { display: block; height: 100%; border-radius: 4px; }
.prog b { position: absolute; top: -4px; width: 2px; height: 16px; border-radius: 1px; background: var(--foreground); }
.hatch { background: repeating-linear-gradient(135deg, var(--c-idle) 0 1.5px, transparent 1.5px 4px) !important; }

/* lists */
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: 48px 22px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.li:last-child { border-bottom: 0; }
.li .tm { font-family: var(--mono); font-size: 12px; color: var(--muted-foreground); }
.li .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ico { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--muted); color: var(--muted-foreground); }
.ico.run { background: var(--run-soft); color: var(--run-ink); } .ico.you { background: var(--you-soft); color: var(--you-ink); }
.ico.bad { background: var(--bad-soft); color: var(--bad-ink); } .ico.warn { background: var(--warn-soft); color: var(--warn-ink); }
.ico.work { background: color-mix(in srgb, var(--c-work) 14%, transparent); color: var(--c-work); }
.barlist { display: flex; flex-direction: column; gap: var(--bl-gap, 6px); }
.bl { display: grid; grid-template-columns: 1fr 64px; gap: 12px; align-items: center; font-size: 13px; }
.bl .bar { position: relative; height: var(--bl-h, 30px); display: flex; align-items: center; padding-left: 10px; }
.bl .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; opacity: .18; }
.bl .bar span { position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bl b { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.check { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
.check:last-child { border-bottom: 0; }
.cb { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--subtle); display: grid; place-items: center; flex-shrink: 0; }
.cb.on { background: var(--foreground); border-color: var(--foreground); color: var(--background); }
.cb.cur { border-color: var(--run); }
.check.done .ct { color: var(--muted-foreground); text-decoration: line-through; text-decoration-color: var(--subtle); }
.check .who { margin-left: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted-foreground); height: 36px; border-bottom: 1px solid var(--border); padding: 0 8px; }
.tbl td { height: 40px; border-bottom: 1px solid var(--border); padding: 0 8px; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .rt { text-align: right; }

/* charts */
.tleg { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted-foreground); flex-wrap: wrap; }
.tleg span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tleg i { width: 8px; height: 8px; border-radius: 50%; }
svg text { font-family: var(--font); }

/* footer drawer bar */
.foot-bar { height: 46px; margin: auto -24px 0; padding: 0 16px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted-foreground); flex-shrink: 0; background: var(--background); }
.foot-bar .btn { color: var(--muted-foreground); }
.foot-bar .btn.on { background: var(--muted); color: var(--foreground); }
.foot-bar .r { margin-left: auto; display: flex; align-items: center; gap: 10px; }

/* sheet (drawer) */
.scrim { position: absolute; inset: 0; background: var(--overlay); z-index: 3; }
.drawer { position: absolute; left: 0; right: 0; bottom: 0; top: 196px; z-index: 4; background: var(--background); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
.drawer .dh { display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.drawer .dh .btn.on { background: var(--muted); color: var(--foreground); }
.drawer .grab { position: absolute; top: 6px; left: 50%; width: 40px; height: 4px; border-radius: 2px; background: var(--border); transform: translateX(-50%); }
.drawer .db { flex: 1; min-height: 0; padding: 18px 24px; display: flex; flex-direction: column; gap: 16px; }

/* command palette */
.cmd { position: absolute; top: 72px; left: 50%; transform: translateX(-50%); width: 620px; z-index: 4; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; }
.cmd .ci { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-bottom: 1px solid var(--border); color: var(--muted-foreground); }
.cmd .ci input { flex: 1; color: var(--foreground); font-size: 14px; height: 44px; }
.cmd .ci input::placeholder { color: var(--muted-foreground); }
.cmd .cl { padding: 6px; max-height: 560px; }
.cmd .cg { font-size: 12px; font-weight: 500; color: var(--muted-foreground); padding: 8px 10px 4px; display: flex; gap: 8px; }
.cmd .cg span + span { margin-left: auto; }
.cmd .it { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border-radius: var(--radius-md); font-size: 13.5px; text-align: left; }
.cmd .it.sel { background: var(--muted); }
.cmd .it .w { margin-left: auto; font-size: 12.5px; color: var(--muted-foreground); }
.cmd .it.you .w { color: var(--you-ink); font-weight: 500; }
.cmd mark { background: transparent; color: var(--foreground); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.cmd .cf { display: flex; align-items: center; gap: 14px; height: 40px; padding: 0 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); }
.cmd .cf span { display: inline-flex; align-items: center; gap: 6px; }

/* skeleton, empty */
.sk { background: var(--muted); border-radius: var(--radius-md); animation: skp 1.6s var(--ease) infinite; }
.center { position: absolute; inset: 56px 0 0; display: grid; place-items: center; z-index: 2; }
.empty { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 460px; }

.tip .r { display: flex; justify-content: space-between; color: var(--tip-muted); padding: 2px 0; gap: 12px; }
.find { display: grid; grid-template-columns: 104px 1fr; gap: 14px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.find .m { white-space: nowrap; font-size: 20px; font-weight: 700; letter-spacing: -.02em; display: flex; align-items: center; gap: 7px; }
.find .m .sw { width: 8px; height: 8px; border-radius: 50%; }
.find .t { font-weight: 600; }
.find .x { color: var(--muted); }
.find .fix { color: var(--muted); margin-top: 3px; font-size: var(--fs-sm); font-style: italic; }
.subh { font-size: var(--fs-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; }
.long { display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; padding: 5px 0; color: var(--muted); }
.long b { color: var(--ink); font-weight: 600; text-align: right; }
.long .lt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.long em { font-style: normal; font-family: var(--mono); font-size: var(--fs-sm); }

/* timeline */
.lanes { display: flex; flex-direction: column; gap: 10px; position: relative; }
.lane { display: grid; grid-template-columns: 190px 1fr; align-items: center; gap: 14px; border-radius: var(--r-sm); }
.lane .ln { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane .ln em { font-style: normal; color: var(--muted); font-family: var(--mono); font-size: var(--fs-sm); margin-left: 6px; }
.lane .trk { height: 26px; background: var(--hl); border-radius: 6px; position: relative; }
.lane .trk i { position: absolute; top: 4px; bottom: 4px; border-radius: 4px; }
.lane .trk i.w { background: var(--run); } .lane .trk i.y { background: var(--you); }
.lane .trk i.s { background: repeating-linear-gradient(135deg, var(--faint) 0 2px, transparent 2px 6px); }
.lane .trk i.z { background: repeating-linear-gradient(135deg, var(--ink-2) 0 2px, transparent 2px 6px); }
.lane .trk i.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.lane .trk u { position: absolute; top: -4px; width: 2px; height: 34px; border-radius: 1px; background: var(--ink); text-decoration: none; }
.lane .trk u.bad { background: var(--bad); }
.lane .trk u::after { content: ""; position: absolute; top: -3px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: inherit; }
.axis { display: grid; grid-template-columns: 190px 1fr; gap: 14px; color: var(--muted); font-size: var(--fs-sm); margin-top: 8px; }
.axis .ticks { display: flex; justify-content: space-between; }
.nowline { position: absolute; top: -6px; bottom: 0; right: 0; width: 0; border-right: 1px solid var(--run); }

/* log */
.filters { display: flex; gap: 6px; margin-bottom: 8px; }
.chip { height: 30px; padding: 0 12px; border-radius: var(--r-pill); border: 1px solid var(--line); color: var(--muted); font-size: var(--fs-sm); display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.chip:hover { border-color: var(--line-strong); }
.linkbtn { color: var(--ink-2); font-weight: 600; font-size: var(--fs-sm); height: 30px; padding: 0 10px; border-radius: var(--r-sm); margin-top: 6px; }
.linkbtn:hover { background: var(--hl); }

/* memory */
.gauge { position: relative; height: 12px; border-radius: 6px; background: var(--track); margin: 18px 0 30px; }
.gauge i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--warn); }
.gauge .mk { position: absolute; top: -6px; height: 24px; width: 2px; background: var(--muted); border-radius: 1px; }
.gauge .mkl { position: absolute; top: 22px; font-size: var(--fs-sm); color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .cl { position: absolute; right: 0; font-size: var(--fs-xs); color: var(--muted); transform: translateY(-120%); }
.app-row { display: grid; grid-template-columns: 150px 1fr 70px; align-items: center; gap: 12px; padding: 6px 0; }
.app-row .tr { height: 8px; background: transparent; position: relative; }
.app-row .tr i { position: absolute; inset: 0 auto 0 0; background: var(--faint); border-radius: 0 4px 4px 0; }
.app-row.claude .tr i { background: var(--run); }
.app-row .v { text-align: right; font-weight: 600; }
.app-row .nm { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.app-row .nm em { font-style: normal; font-size: var(--fs-xs); color: var(--muted); border: 1px solid var(--line-strong); border-radius: var(--r-pill); padding: 0 6px; }
.advice { margin-top: 12px; padding: 12px 14px; border-radius: var(--r-md); background: var(--warn-soft); border: 1px solid var(--warn-line); }
.run-row { display: grid; grid-template-columns: 1fr 90px 80px 70px; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: center; }
.run-row:last-child { border-bottom: 0; }
.run-row code { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.run-row .v { text-align: right; font-weight: 600; }
.run-row .m { color: var(--muted); font-size: var(--fs-sm); }
.run-row.h { color: var(--muted); font-size: var(--fs-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding-top: 0; }

/* menu */
.menu { position: absolute; z-index: 10; top: 54px; width: 470px; padding: 8px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line-strong); box-shadow: var(--shadow-2); }
.menu .mh { font-size: var(--fs-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 4px; }
.mi { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 8px 10px; border-radius: var(--r-sm); }
.mi:hover, .mi.hov { background: var(--hl); }
.mi .mt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mi .mt em { font-style: normal; color: var(--muted); margin-left: 6px; font-size: var(--fs-sm); }
.mi .ms { color: var(--muted); font-size: var(--fs-sm); white-space: nowrap; }
.msearch { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; margin-bottom: 6px; border-radius: var(--r-sm); background: var(--hl); border: 1px solid var(--line); }
.msearch input { flex: 1; min-width: 0; height: 32px; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; }
.msearch input::placeholder { color: var(--muted); }
.msearch:focus-within { border-color: var(--run); }
.mscroll { max-height: 520px; overflow: auto; }
.mp { display: flex; align-items: center; gap: 8px; padding: 10px 10px 4px; font-weight: 700; font-size: var(--fs-sm); }
.mp em { font-style: normal; font-weight: 400; color: var(--muted); margin-left: auto; }
.mfoot { display: flex; align-items: center; gap: 6px; padding: 10px 10px 4px; margin-top: 6px; border-top: 1px solid var(--line); color: var(--muted); font-size: var(--fs-sm); }
.mfoot .k:nth-of-type(3), .mfoot .k:nth-of-type(4) { margin-left: 10px; }
.scrim { position: absolute; inset: 60px 0 0 0; z-index: 4; }

/* skeleton / empty */
.sk { border-radius: var(--r-sm); background: linear-gradient(90deg, var(--hl) 0, var(--track) 50%, var(--hl) 100%); background-size: 800px 100%; animation: shimmer 1.4s linear infinite; }
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding-bottom: 80px; }
.empty .e1 { font-size: var(--fs-lg); font-weight: 700; }
.empty .e2 { color: var(--muted); max-width: 460px; }
.empty .glyph { width: 56px; height: 56px; border-radius: 16px; border: 1px solid var(--line-strong); display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--muted); margin-bottom: 6px; }
.empty .glyph svg { width: 26px; height: 26px; }
.dim { opacity: .45; filter: saturate(.2); pointer-events: none; }

.kv { display: grid; grid-template-columns: 1fr auto; row-gap: 8px; color: var(--muted); }
.kv b { color: var(--ink); font-weight: 600; text-align: right; }
}
</style>

<script>
/*__PROOF_DATA__*/
(() => {
  const { html, render, useState, useEffect, useRef } = window.htmPreact;

  // ---- page parameters --------------------------------------------------------------------------------------------
  // ?data=<same-origin path> reads a fixed feed instead of the live one (fixtures, replays); the clock stops at its `now`.
  // ?theme=light|dark forces a theme. ?simulate=offline|loading shows those states. ?pin=<testid> holds a hover state.
  const P = new URLSearchParams(location.search);
  const DATA_URL = (p => (p && p.startsWith('/') && !p.startsWith('//') ? p : null))(P.get('data'));
  const SIM = P.get('simulate');
  const PIN = P.get('pin');
  const EMBEDDED = window.__PROOF_DATA__ || null;
  const FROZEN = !!(DATA_URL || EMBEDDED);
  const THEME_KEY = 'proof-theme';
  (() => {
    let t = P.get('theme');
    if (!t) try { t = localStorage.getItem(THEME_KEY); } catch {}
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  })();

  // ---- formatting -------------------------------------------------------------------------------------------------
  const pad = n => String(n).padStart(2, '0');
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  // 42s · 18m · 1h 05m · 49h 35m
  const dur = ms => {
    ms = Math.max(0, ms); const m = Math.floor(ms / 60e3), h = Math.floor(m / 60);
    if (m < 1) return `${Math.floor(ms / 1000)}s`;
    return h ? `${h}h ${pad(m % 60)}m` : `${m}m`;
  };
  // 6:12 · 18:04 · 1:02:07
  const timer = ms => {
    const s = Math.floor(Math.max(0, ms) / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
    return h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${Math.floor(s / 60)}:${pad(s % 60)}`;
  };
  // 9m 02s · 2m 16s · 11s
  const durS = ms => { const s = Math.round(Math.max(0, ms) / 1000), m = Math.floor(s / 60); return m ? `${m}m ${pad(s % 60)}s` : `${s}s`; };
  const ago = ms => (ms >= 48 * 3600e3 ? `${Math.floor(ms / 86400e3)} days ago` : `${dur(ms)} ago`);
  const coarse = ms => (ms < 3600e3 ? `${Math.max(1, Math.floor(ms / 60e3))}m` : `${Math.floor(ms / 3600e3)}h`);
  const clock = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const gb = mb => `${(mb / 1024).toFixed(1)} GB`;
  const size = mb => (mb >= 1024 ? gb(mb) : `${Math.round(mb)} MB`);
  const pct = x => `${Math.round(x)}%`;
  const lcfirst = s => (s ? s[0].toLowerCase() + s.slice(1) : s);
  const modelName = m => { const x = String(m || '').match(/(opus|sonnet|haiku|fable)-(\d+)-(\d+)/i); return x ? `${x[1][0].toUpperCase()}${x[1].slice(1)} ${x[2]}.${x[3]}` : (m || ''); };

  // ---- icons ------------------------------------------------------------------------------------------------------
  const SVG = {
    check: html`<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" fill="currentColor" opacity=".16"/><path d="M5 8.2l2 2 4-4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    cross: html`<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.5" fill="currentColor"/><path d="M5.5 5.5l5 5M10.5 5.5l-5 5" stroke="var(--surface)" stroke-width="1.7" stroke-linecap="round"/></svg>`,
    todo: html`<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.4 2.4"/></svg>`,
    dot: html`<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.5" fill="currentColor"/></svg>`,
    you: html`<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.5" fill="currentColor"/><rect x="7.1" y="3.8" width="1.8" height="5.4" rx=".9" fill="var(--surface)"/><circle cx="8" cy="11.6" r="1.1" fill="var(--surface)"/></svg>`,
    idle: html`<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5"/></svg>`,
    stall: html`<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.8V8l2.2 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
    commit: html`<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M1.5 8H5M11 8h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
    mem: html`<svg viewBox="0 0 16 16" fill="none"><rect x="2" y="4" width="12" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M5 7v2M8 7v2M11 7v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
    warn: html`<svg viewBox="0 0 16 16"><path d="M8 1.8l6.6 11.6H1.4z" fill="currentColor"/><rect x="7.2" y="5.6" width="1.6" height="4.2" rx=".8" fill="var(--surface)"/><circle cx="8" cy="11.5" r=".95" fill="var(--surface)"/></svg>`,
    tool: html`<svg viewBox="0 0 16 16" fill="none"><path d="M4 5l3 3-3 3M8.5 11H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    moon: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`,
    sun: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`,
    left: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>`,
    plug: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a6 6 0 0 1-12 0V8z"/></svg>`,
    inbox: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>`,
    search: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`,
    folder: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4l2 2.5h9A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>`,
    chev: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="m6 9 6 6 6-6"/></svg>`,
  };
  // design v2 icons, as drawn in the mockup
  const I = {
    x: html`<svg width="9" height="9" viewBox="0 0 10 10"><path d="M3 3l4 4M7 3l-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
    chev: html`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>`,
    moon: html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`,
    sun: html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`,
  };
  const ICON = { run: 'dot', you: 'you', done: 'check', fail: 'cross', idle: 'idle', stall: 'stall', todo: 'todo', commit: 'commit', mem: 'mem', warn: 'warn', tool: 'tool' };
  const ICOLOR = { run: 'var(--run)', you: 'var(--you)', done: 'var(--ok)', todo: 'var(--faint)', fail: 'var(--bad)', idle: 'var(--faint)', stall: 'var(--faint)', commit: 'var(--ink-2)', mem: 'var(--warn)', warn: 'var(--warn)', tool: 'var(--muted)' };
  const Ic = ({ s, id, lg }) => html`<span class=${`ic ${lg ? 'lg' : ''} ${s === 'run' ? 'pulse' : ''}`} style=${`color:${ICOLOR[s]}`} data-testid=${id} aria-hidden="true">${SVG[ICON[s]]}</span>`;
  const Logo = ({ live }) => html`<span class=${`brand ${live ? '' : 'off'}`} data-testid="brand" title=${live ? 'Live' : 'Not live'}><svg viewBox="0 10 332 122" role="img" aria-label=${`proof, ${live ? 'live' : 'not live'}`}><g fill="none" stroke="currentColor" stroke-width="14"><path d="M7 40V132"/><circle cx="30" cy="70" r="23"/><path d="M82 100V40M82 68C82 52 94 47 112 47"/><circle cx="148" cy="70" r="23"/><circle cx="214" cy="70" r="23"/><path d="M262 100V38C262 24 270 17 286 17M246 47H284"/></g><circle class="halo" cx="314" cy="83" r="17"/><circle class="live" cx="314" cy="83" r="17"/></svg></span>`;

  // ---- what a session's state means ----------------------------------------------------------------------------------
  const NEEDS = st => st === 'approval' || st === 'needsInput';
  const BUSY = st => st === 'working' || st === 'thinking' || st === 'agents';
  const iconOf = v => (NEEDS(v.status.state) ? 'you' : BUSY(v.status.state) ? 'run' : v.status.state === 'stalled' ? 'stall' : 'idle');
  const runningJobs = v => v.now.filter(n => n.type !== 'main');
  const doneUnits = v => v.units.filter(u => !u.running);
  const unitFor = (v, who) => v.units.find(u => u.desc === who);
  const lastEvent = (v, kind) => v.events.find(e => e.kind === kind);

  function statusText(v, now) {
    const s = v.status, n = runningJobs(v).length;
    switch (s.state) {
      case 'agents': return `Working: ${plural(n || s.agents || 0, 'agent')} running`;
      case 'thinking': return 'Thinking';
      case 'approval': return html`Approve a command: <code>${s.label}</code>`;
      case 'needsInput': return s.label && /^Claude /.test(s.label) ? s.label : 'Claude asked you something';
      case 'waiting': return 'Finished, waiting for your next message';
      case 'stalled': { const ms = now - s.since; return `No activity for ${ms < 3600e3 ? plural(Math.floor(ms / 60e3), 'minute') : dur(ms)}`; }
      default: {
        if (s.cat === 'gate') { const m = String(s.label || '').match(/\((\d+) of (\d+) done\)/); return m ? `Running the proof gate: ${m[1]} of ${m[2]} checks done` : 'Running the proof gate'; }
        return n ? `Working: ${plural(n, 'agent')} running` : `Working: ${lcfirst(s.label || 'on it')}`;
      }
    }
  }
  function statusSub(v, now) {
    const s = v.status, bits = [];
    if (s.state === 'agents') bits.push('Main thread is waiting on them');
    if (NEEDS(s.state)) {
      const fail = v.events.find(e => e.kind === 'gateFail' && Math.abs(e.t - s.since) < 120e3);
      return `${fail ? 'The gate found a failing check, so Claude stopped to ask you' : 'Claude is waiting for your answer'} · waiting ${dur(now - s.since)}`;
    }
    if (s.state === 'waiting') {
      const c = v.commits[0];
      return [`Idle ${dur(now - s.since)}`, v.commits.length ? `${plural(v.commits.length, 'commit')}: ${c.sha.slice(0, 7)} ${c.msg}` : null].filter(Boolean).join(' · ');
    }
    if (s.state === 'stalled') {
      const last = v.feed.find(f => f.end);
      return last ? html`Nothing is running and Claude isn't waiting on you. The last step was ${rich(last.desc)}, which finished ${ago(now - last.end)}.` : "Nothing is running and Claude isn't waiting on you.";
    }
    if (v.commits[0]) bits.push(`last commit ${ago(now - v.commits[0].t)}`);
    const g = lastEvent(v, 'gatePass');
    if (g) bits.push(`gate passed ${ago(now - g.t)}`);
    return bits.join(' · ');
  }

  // ---- the shell ------------------------------------------------------------------------------------------------------
  const TAB_MAX = 4;
  // Up to 4 tabs in feed order. The selected session and the first session that needs you always get one.
  function tabsFor(sessions, sel) {
    const tabs = sessions.slice(0, TAB_MAX);
    const keep = [sel, sessions.find(x => NEEDS(x.status.state))].filter(Boolean);
    for (const x of keep) {
      if (tabs.includes(x)) continue;
      for (let i = tabs.length - 1; i >= 0; i--) if (!keep.includes(tabs[i])) { tabs[i] = x; break; }
    }
    return tabs;
  }

  // Tab dots: green and pulsing while Claude works, coral when it needs you, grey when stalled, hollow when idle.
  const dotOf = v => (NEEDS(v.status.state) ? 'you' : BUSY(v.status.state) ? 'live' : v.status.state === 'stalled' ? 'grey' : 'idle');
  const isDark = () => (document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);

  function Top({ st, set, data, sel, live }) {
    const sessions = data ? data.sessions : [];
    const tabs = tabsFor(sessions, sel);
    const hidden = sessions.filter(x => !tabs.includes(x));
    const hiddenNeeds = hidden.filter(x => NEEDS(x.status.state)).length;
    const sys = data && data.machine && data.machine.system;
    const hi = sys && sys.pct >= sys.warnPct;
    const dark = isDark();
    const toggle = () => { const t = dark ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem(THEME_KEY, t); } catch {} set({}); };
    return html`<div class="top">
      <div class=${`logo ${live ? '' : 'off'}`} data-testid="logo" title=${live ? 'Live' : 'Not live'}>proof<i>.</i></div>
      ${tabs.map((x, k) => html`<button class=${`stab ${x === sel ? 'on' : ''}`} data-testid=${`tab-${k + 1}`} aria-current=${x === sel} onClick=${() => set({ s: x.id, v: null, d: null, m: null })}><span class=${`dot ${dotOf(x)}`}></span><span class="t">${x.title}</span>${NEEDS(x.status.state) ? html`<span class="badge solid-you" style="height:20px">needs you</span>` : null}</button>`)}
      ${hidden.length ? html`<button class=${`btn ghost ${st.m ? 'on' : ''}`} data-testid="more" aria-expanded=${!!st.m} onClick=${() => set({ m: st.m ? null : '1', q: null })}>+${hidden.length} more ${hiddenNeeds ? html`<span class="badge solid-you" style="height:20px">${hiddenNeeds} needs you</span>` : null}${I.chev}</button>` : null}
      <span class="spacer"></span>
      ${sys ? html`<button class="btn out" data-testid="mem-pill" aria-pressed=${st.v === 'memory'} onClick=${() => set({ v: 'memory', m: null })}><span>Memory</span><b class="num" style=${`color:${hi ? 'var(--warn-ink)' : 'var(--foreground)'}`}>${pct(sys.pct)}</b><${Spark} series=${data.machine.samples || []} w=${60} h=${16} color=${hi ? 'var(--warn)' : 'var(--c-think)'} /></button>` : null}
      <span class="sep"></span>
      <button class="btn ghost icon" aria-label="Switch theme" data-testid="theme" onClick=${toggle}>${dark ? I.sun : I.moon}</button>
    </div>`;
  }

  // Memory over time as a small area chart (Tremor SparkAreaChart): samples are [t, percent], drawn from 40% to 100%.
  let sparkN = 0;
  function Spark({ series, w, h, color, ceiling, id, fluid }) {
    const [g] = useState(() => `spark${++sparkN}`);
    const Y = p => h - 1 - (p - 40) / 60 * (h - 2);
    const t0 = series.length ? series[0][0] : 0, t1 = series.length ? series[series.length - 1][0] : 1;
    const X = t => (t1 > t0 ? (t - t0) / (t1 - t0) * w : 0);
    const pts = series.map(s => `${X(s[0]).toFixed(1)},${Y(Math.max(40, Math.min(100, s[1]))).toFixed(1)}`).join(' ');
    return html`<svg width=${fluid ? '100%' : w} height=${h} viewBox=${`0 0 ${w} ${h}`} preserveAspectRatio="none" style="overflow:visible;display:block" data-testid=${id} aria-hidden="true">
      <defs><linearGradient id=${g} x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color=${color} stop-opacity=".28" /><stop offset="1" stop-color=${color} stop-opacity="0" /></linearGradient></defs>
      ${series.length > 1 ? html`<polygon points=${`0,${h} ${pts} ${w},${h}`} fill=${`url(#${g})`} /><polyline points=${pts} fill="none" stroke=${color} stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke" />` : null}
      ${ceiling != null ? html`<line x1="0" x2=${w} y1=${Y(ceiling)} y2=${Y(ceiling)} stroke="var(--bad)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" />` : null}
    </svg>`;
  }

  function FootBar({ st, set, v, updated }) {
    // Gate failures since the last pass. Not repeated when the status card already says the session needs you.
    const lastPass = v ? (v.events.find(e => e.kind === 'gatePass') || { t: 0 }).t : 0;
    const fails = !v || NEEDS(v.status.state) ? 0 : v.events.filter(e => e.kind === 'gateFail' && e.t > lastPass).length;
    const b = (k, key, label) => html`<button class=${`btn ${st.d === k ? 'on' : ''}`} data-testid=${`drawer-${k}`} aria-pressed=${st.d === k} onClick=${() => set({ d: st.d === k ? null : k, v: null })}><span class="kbd">${key}</span>${label}</button>`;
    return html`<div class="foot-bar">
      ${b('timeline', 'T', 'Timeline')}${b('time', 'W', 'Where the time went')}${b('log', 'L', 'Log')}
      <div class="r">${fails ? html`<span class="badge bad" data-testid="foot-gate">${I.x} ${plural(fails, 'gate failure')}</span>` : null}<span data-testid="updated">${updated}</span></div>
    </div>`;
  }

  // Views still on design v1 render inside this, which scopes the v1 styles to them. Each unit removes its view from it.
  const V1 = ({ children, inline }) => html`<div class="v1" style=${inline ? 'display:contents' : ''}>${children}</div>`;

  const Head = ({ v }) => html`<div class="head"><h1 data-testid="session-title">${v.title}</h1><span class="meta" data-testid="session-meta">${v.project}${v.branch ? html` · <code>${v.branch}</code>` : null} · started ${ago(NOW() - v.start)}${v.model ? ` · ${modelName(v.model)}` : ''}</span></div>`;

  function Progress({ v }) {
    const total = v.tasks.length;
    if (!total && !v.features) return null;
    const done = v.tasks.filter(t => t.status === 'completed').length, doing = v.tasks.filter(t => t.status === 'in_progress').length;
    const segs = v.tasks.map((t, k) => html`<i class=${k < done ? 'd' : k < done + doing ? 'c' : ''}></i>`);
    return html`<div class="prog" data-testid="progress">
      ${total ? html`<div class="row"><span>Tasks</span><span><b class="num">${done} of ${total}</b> done</span></div><div class="seg">${segs}</div>` : null}
      ${v.features ? html`<div class="row" style=${total ? 'margin:8px 0 0' : ''}><span>Features</span><span class="num"><b>${v.features.passing}</b> / ${v.features.total} passing</span></div>` : null}
    </div>`;
  }

  function StatusCard({ v, compact }) {
    const now = NOW(), s = v.status, needs = NEEDS(s.state);
    const showTimer = !compact && !needs && s.state !== 'waiting' && s.since;
    return html`<div class=${`card status ${compact ? 'compact' : ''} ${needs ? 'you' : ''}`}>
      <${Ic} s=${iconOf(v)} id="status-icon" lg=${!compact} />
      <div style="flex:1"><div class="big" data-testid="status-text">${statusText(v, now)}</div>${compact ? null : html`<div class="sub" data-testid="status-sub">${statusSub(v, now)}</div>`}</div>
      ${showTimer ? html`<div class="timer num" data-testid="status-timer">${timer(now - s.since)}</div>` : null}
      ${needs && !compact ? html`<div class="where" data-testid="status-where">Answer it in the terminal running this session<code>${shortPath(v.cwd)}</code></div>` : null}
      ${needs || s.state === 'waiting' || s.state === 'stalled' ? null : html`<${Progress} v=${v} />`}
    </div>`;
  }
  // File paths, specs and commands in a label read as code: "Editing src/api/orders.ts", "Running e2e tests · checkout.spec.ts › …".
  function rich(label) {
    const s = String(label || ''), i = s.indexOf(' · ');
    if (/^[a-z][\w.:-]*( |$)/.test(s) && !/[A-Z]/.test(s)) return html`<code>${s}</code>`;   // a command: pnpm docs:build
    if (i > 0) return html`${s.slice(0, i)} · <code>${s.slice(i + 3)}</code>`;
    return s.split(/(\S*[/.]\w+(?:\.\w+)*)/).map((part, k) => (k % 2 ? html`<code>${part}</code>` : part));
  }
  const shortPath = p => { const parts = String(p || '').split('/').filter(Boolean); return parts.length > 1 ? `~/…/${parts[parts.length - 1]}` : p || ''; };

  // ---- session home: the run graph and the plan ------------------------------------------------------------------------
  function Job({ v, n, k, now, compact }) {
    const el = n.since ? now - n.since : 0, past = el >= 5 * 60e3, u = unitFor(v, n.who);
    const testid = `job-${k}`;
    return html`<button class="node run" data-testid=${testid} onClick=${() => SET({ v: 'job', j: n.who })}>
      <div class="t"><${Ic} s="run" />${n.who}${PIN === testid ? html`<span class="open">Open ›</span>` : null}</div>
      <div class="d">${rich(n.label)}</div>
      ${past ? html`<div class="tbar warn"><i style=${`width:${Math.min(100, el / 6000).toFixed(0)}%`}></i></div>` : null}
      ${compact ? null : html`<div class="f num">${past ? html`<span class="warn">${timer(el)} of 10:00 limit</span>` : html`<span>${timer(el)}</span>`}${n.where ? html`<span class="mono">${n.where}</span>` : null}${u && u.commits ? html`<span>${plural(u.commits, 'commit')}</span>` : null}</div>`}
    </button>`;
  }

  function RunPanel({ v, folded }) {
    const now = NOW(), running = runningJobs(v), done = doneUnits(v), main = v.now[0];
    const mainCommits = v.commits.filter(c => c.who === 'Main thread').length;
    const mainLine = v.status.state === 'agents' ? `Waiting on ${plural(running.length, 'agent')}` : v.status.label;
    return html`<div class="card panel">
      <div class="ph"><span data-testid="run-title">Run</span><span class="r" data-testid="run-count">${running.length || done.length ? `${running.length} running · ${done.length} done` : 'no agents yet'}</span></div>
      <div class="graph">
        <button class="node" data-testid="job-main" onClick=${() => SET({ v: 'job', j: 'main' })}><div class="t"><${Ic} s=${v.status.state === 'agents' ? 'idle' : iconOf(v)} />Main thread</div><div class="d">${mainLine}</div><div class="f num"><span>${dur(now - v.start)}</span><span>${plural(mainCommits, 'commit')}</span></div></button>
        <div class="wire"></div>
        <div class="jobs">
          ${!running.length && !done.length ? html`<div class="glabel" data-testid="run-group-steps">Recent steps</div>${v.feed.slice(0, 8).map((f, k) => html`<div class="ev" data-testid=${`step-feed-${k + 1}`} style="grid-template-columns:52px 20px 1fr auto;padding:7px 0"><span class="tm">${clock(f.t)}</span><${Ic} s=${f.end == null ? 'run' : f.ok === false ? 'fail' : 'done'} /><span class="tx">${rich(f.desc)}</span><span class="tag num">${f.end == null ? timer(now - f.t) : durS(f.end - f.t)}</span></div>`)}` : null}
          ${running.length ? html`<div class="glabel" data-testid="run-group-running">Running</div>` : null}
          ${running.map((n, k) => html`<${Job} v=${v} n=${n} k=${k + 1} now=${now} />`)}
          ${done.length && folded ? html`<div class="glabel" data-testid="run-group-done">Done · ${done.length} more, folded to fit</div>` : null}
          ${done.length && !folded ? html`<div class="glabel" data-testid="run-group-done">Done</div>` : null}
          ${folded ? null : done.map((u, k) => html`<button class="node done" data-testid=${`job-${running.length + k + 1}`} onClick=${() => SET({ v: 'job', j: u.desc })}><div class="t"><${Ic} s=${u.errors && !u.commits ? 'fail' : 'done'} />${u.desc}<span class="rt num">${dur((u.end || now) - u.start)}${u.commits ? ` · ${plural(u.commits, 'commit')}` : ''}</span></div></button>`)}
        </div>
      </div>
    </div>`;
  }

  function PlanPanel({ v, folded }) {
    const tasks = v.tasks, done = tasks.filter(t => t.status === 'completed').length;
    const owner = t => t.owner || '';
    if (!tasks.length) return html`<div class="card panel">
      <div class="ph"><span data-testid="plan-title">Plan</span></div>
      <div style="height:150px;border:1px dashed var(--line-strong);border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:0 16px">
        <span data-testid="plan-empty">No task list in this session</span>
        <span data-testid="plan-empty-sub" style="color:var(--muted);font-size:var(--fs-sm)">Agents show here as work items when there are any</span>
      </div>
    </div>`;
    const rows = [];
    tasks.forEach((t, k) => {
      const id = `step-${k + 1}`;
      if (t.status === 'completed') {
        if (folded && k < done - 1) return;
        rows.push(html`<li class="d" data-testid=${id}><${Ic} s="done" />${t.subject}${folded && done > 1 ? html` <span class="who">and ${done - 1} earlier</span>` : null}</li>`);
      } else if (t.status === 'in_progress') rows.push(html`<li class="c" data-testid=${id}><${Ic} s="run" />${t.subject}${owner(t) ? html`<span class="who">${owner(t)}</span>` : null}</li>`);
      else {
        const todo = tasks.filter(x => x.status !== 'completed' && x.status !== 'in_progress');
        if (folded) { if (t === todo[0]) rows.push(html`<li data-testid=${id}><${Ic} s="todo" />${todo.length} more to do</li>`); return; }
        rows.push(html`<li data-testid=${id}><${Ic} s="todo" />${t.subject}</li>`);
      }
    });
    return html`<div class="card panel">
      <div class="ph"><span data-testid="plan-title">Plan</span><span class="r num" data-testid="plan-count">${done} / ${tasks.length}</span></div>
      <ul class="steps">${rows}</ul>
    </div>`;
  }

  function EventRow({ e, id, now }) {
    if (e.kind === 'step') return html`<div class=${`ev ${e.ok === false ? 'fail' : ''}`} data-testid=${id}><span class="tm">${clock(e.t)}</span><${Ic} s=${e.ok === false ? 'fail' : 'done'} /><span class="tx">${rich(e.text)}${e.ms != null ? html` <em>${durS(e.ms)}</em>` : null}</span><span class="tag">${e.cat || ''}</span></div>`;
    const icon = { needsInput: 'you', gateFail: 'fail', commitBlocked: 'fail', memory: 'mem', guard: 'mem', commit: 'commit', gatePass: 'done', agentDone: 'done', compact: 'tool', interrupt: 'you', error: 'fail', gaveUp: 'fail' }[e.kind] || 'tool';
    const tag = { gateFail: 'gate', gatePass: 'gate', commitBlocked: 'gate', memory: 'memory', guard: 'memory', commit: 'commit', compact: 'compact', agentDone: 'agent', error: 'error' }[e.kind] || '';
    return html`<div class=${`ev ${icon === 'fail' ? 'fail' : ''}`} data-testid=${id}><span class="tm">${clock(e.t)}</span><${Ic} s=${icon} /><span class="tx">${eventText(e)}</span><span class="tag">${tag}</span></div>`;
  }
  function eventText(e) {
    if (e.kind === 'commit') { const [sha, ...msg] = String(e.text).split(' '); return html`Commit ${sha} <em>${msg.join(' ')}</em>`; }
    if (e.kind === 'needsInput') return 'Claude stopped to ask you something';
    if (e.kind === 'gatePass') return `Gate passed: ${String(e.text).replace(/^proof:\s*/, '')}`;
    if (e.kind === 'gateFail') return `Gate failed: ${String(e.text).replace(/^proof:\s*/, '').replace(/\s+—.*$/, '')}`;
    if (e.kind === 'commitBlocked') return `Commit blocked: ${String(e.text).replace(/^proof:\s*commit refused\s*—\s*/, '')}`;
    return String(e.text).replace(/^proof( memory)?:\s*/, m => (m.includes('memory') ? 'Memory: ' : ''));
  }

  function Home({ v, st, set, banner }) {
    const s = v.status.state;
    if (st.d === 'timeline' || st.d === 'time' || st.d === 'log') return html`<div class="body"><${Head} v=${v} /><${StatusCard} v=${v} compact=${true} />
      ${st.d === 'timeline' ? html`<${Timeline} v=${v} st=${st} set=${set} />` : st.d === 'time' ? html`<${TimeView} v=${v} st=${st} set=${set} />` : html`<${LogView} v=${v} st=${st} set=${set} />`}</div>`;
    let main;
    if (NEEDS(s)) main = html`<div class="grid">
      <div class="card panel">
        <div class="ph"><span data-testid="led-title">What led here</span><span class="r" data-testid="led-order">newest first</span></div>
        ${v.events.slice(0, 5).map((e, k) => html`<${EventRow} e=${e} id=${`led-${k + 1}`} />`)}
      </div>
      <${PlanPanel} v=${v} />
    </div>`;
    else if (s === 'waiting' && !runningJobs(v).length) main = html`<${Finished} v=${v} set=${set} />`;
    else if (s === 'stalled') main = html`<div class="grid">
      <div class="card panel">
        <div class="ph"><span data-testid="happened-title">Last activity</span><span class="r" data-testid="happened-scope">newest first</span></div>
        ${lastActivity(v).map((e, k) => html`<${EventRow} e=${e} id=${`happened-${k + 1}`} />`)}
      </div>
      <${PlanPanel} v=${v} />
    </div>`;
    else main = html`<div class="grid"><${RunPanel} v=${v} folded=${banner} /><${PlanPanel} v=${v} folded=${banner} /></div>`;
    return html`<div class="body"><${Head} v=${v} /><${StatusCard} v=${v} />${main}</div>`;
  }
  const asStep = (f, withMs) => ({ t: f.t, kind: 'step', text: f.desc, cat: f.cat, ok: f.ok, ms: withMs ? f.end - f.t : null });
  const newest = (list, n) => list.sort((a, b) => b.t - a.t).slice(0, n);
  const lastActivity = v => newest([...v.feed.filter(f => f.end).slice(0, 3).map(f => asStep(f)), ...v.events.slice(0, 3)], 3);

  function Finished({ v, set }) {
    const b = buckets(v.share);
    return html`<div class="grid" style="grid-template-columns:1fr 1fr">
      <div class="card panel">
        <div class="ph"><span data-testid="happened-title">What happened</span><span class="r" data-testid="happened-scope">this session</span></div>
        ${newest([...v.events.slice(0, 3), ...v.feed.filter(f => f.end && f.end - f.t >= 60e3).slice(0, 3).map(f => asStep(f, true))], 3).map((e, k) => html`<${EventRow} e=${e} id=${`happened-${k + 1}`} />`)}
        <div class="kv" style="margin-top:18px" data-testid="happened-totals"><span>Tool calls</span><b class="num">${v.counts.toolCalls || 0}</b><span>Commits</span><b class="num">${v.commits.length}</b><span>Commit blocks</span><b class="num">${v.counts.commitBlocks || 0}</b><span>Tool errors</span><b class="num">${v.counts.toolErrors || 0}</b></div>
      </div>
      <div class="card panel">
        <div class="ph"><span data-testid="time-mini-title">Where the time went</span><button class="linkbtn" style="margin:0 0 0 auto" data-testid="time-mini-open" onClick=${() => set({ d: 'time' })}>Open in full ›</button></div>
        <div class="sbar" data-testid="time-mini-bar" role="img" aria-label=${`Claude working ${fmMin(b.work, 1)}, waiting on you ${fmMin(b.you, 1)}, stalls ${fmMin(b.stall, 1)}`}><i class="w" style=${`flex:${b.work}`}></i><i class="y" style=${`flex:${b.you}`}></i><i class="s" style=${`flex:${b.stall}`}></i></div>
        <div class="legend" data-testid="time-mini-legend" style="flex-wrap:wrap;row-gap:4px"><span><i class="sw w"></i>Claude working <b class="num">${fmMin(b.work)}</b></span><span><i class="sw y"></i>Waiting on you <b class="num">${fmMin(b.you)}</b></span><span><i class="sw s"></i>Stalls <b class="num">${fmMin(b.stall)}</b></span>${v.status.state === 'waiting' ? html`<span>includes the ${dur(NOW() - v.status.since)} since it finished</span>` : null}</div>
        <div class="subh" data-testid="time-mini-long-title">Longest single steps</div>
        ${(v.findings.longest || []).slice(0, 3).map((x, k) => html`<div class="long" data-testid=${`time-mini-long-${k + 1}`}><b class="num">${durS(x.ms)}</b><span class="lt">${x.desc}</span><em>${CAT[x.cat] || x.cat}</em></div>`)}
      </div>
    </div>`;
  }

  // ---- where the time went --------------------------------------------------------------------------------------------
  const STALL = new Set(['idle', 'asleep', 'api', 'compact']);
  const GROUPS = [['Thinking & writing', ['model']], ['Tests & checks', ['test', 'typecheck']], ['Reading & editing', ['read', 'edit', 'plan', 'web']], ['proof gate', ['gate']], ['Screens & browser', ['fidelity']], ['Git & other commands', ['git', 'shell', 'hooks']], ['Builds & dev servers', ['build', 'devserver']], ['Subagents', ['subagent']]];
  function buckets(share) {
    let work = 0, you = 0, stall = 0;
    for (const [k, ms] of Object.entries(share || {})) { if (k === 'waitUser') you += ms; else if (STALL.has(k)) stall += ms; else work += ms; }
    return { work, you, stall, clock: work + you + stall };
  }
  const fmMin = (ms, spoken) => (ms > 0 && ms < 60e3 ? (spoken ? 'under 1m' : '<1m') : dur(ms));

  const CLS = cat => (cat === 'waitUser' ? 'y' : cat === 'asleep' ? 'z' : STALL.has(cat) ? 's' : 'w');

  // ---- timeline -----------------------------------------------------------------------------------------------------
  // What a lane is about: the one agent's task ("payment screen"), or how many agents worked there.
  const laneSub = l => (l.r.key !== 'Reviews' && l.who.length === 1 ? String(l.who[0]).replace(/^[^:]*:\s*/, '') : l.r.sub);
  function Timeline({ v, st, set }) {
    const now = NOW(), from = v.from, to = v.to, span = Math.max(1, to - from);
    const P = t => Math.max(0, Math.min(100, ((t - from) / span) * 100));
    const [hover, setHover] = useState(null);
    const hours = Number(st.h) || Math.round(DATA_WINDOW() / 3600e3);
    const lanes = v.rows.map(r => {
      const who = r.key === 'main' ? ['Main thread'] : r.who || [];
      const marks = [
        ...v.commits.filter(c => who.includes(c.who)).map(c => ({ t: c.t, bad: false })),
        ...v.events.filter(e => e.kind === 'gateFail' && (r.key === 'main' ? e.who === 'proof gate' || e.who === 'Main thread' : who.includes(e.who))).map(e => ({ t: e.t, bad: true })),
      ].filter(m => m.t >= from);
      return { r, who, marks, blocks: (r.lane || []).filter(([a, b]) => b > from) };
    });
    const tipFor = (lane, block) => {
      const [a, b, cat] = block, running = b >= to - 2000;
      const call = v.feed.find(f => lane.who.includes(f.who) && f.t <= b && (f.end ?? now) >= a && f.cat === cat);
      return { lane, block, title: `${lane.r.label} · ${CAT[cat] || cat}`, ms: b - a, when: `${clock(a)} to ${running ? 'now' : clock(b)}`, state: running ? 'running' : '', desc: call ? call.desc : '' };
    };
    const pinned = (() => { const m = String(PIN || '').match(/^tl-lane-(\d+)$/); if (!m) return null; const l = lanes[Number(m[1]) - 1]; return l && l.blocks.length ? tipFor(l, l.blocks[l.blocks.length - 1]) : null; })();
    const [kb, setKb] = useState(null);   // { lane index, block index } from the arrow keys
    const keyed = kb && lanes[kb.lane] && lanes[kb.lane].blocks[kb.i] ? tipFor(lanes[kb.lane], lanes[kb.lane].blocks[kb.i]) : null;
    const tip = hover || keyed || pinned;
    const onKey = (k, e) => {
      const n = lanes[k].blocks.length;
      if (!n || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
      e.preventDefault();
      const cur = kb && kb.lane === k ? kb.i : e.key === 'ArrowLeft' ? n : -1;
      setKb({ lane: k, i: Math.max(0, Math.min(n - 1, cur + (e.key === 'ArrowRight' ? 1 : -1))) });
    };
    const onMove = (lane, e) => {
      const r = e.currentTarget.getBoundingClientRect(), t = from + ((e.clientX - r.left) / r.width) * span;
      const b = lane.blocks.find(([a, z]) => t >= a && t <= z);
      setHover(b ? { ...tipFor(lane, b), x: e.clientX, y: r.bottom } : null);
    };
    const ticks = [0, 1, 2, 3].map(i => clock(from + (i / 4) * span));
    return html`<div class="card panel" style="flex:1;margin-bottom:20px;display:flex;flex-direction:column;overflow:visible">
      <div class="ph"><span data-testid="tl-title">One lane per worktree</span>
        <span class="r" style="display:flex;gap:8px;align-items:center"><span class="scope">${[1, 2, 6, 24].map(h => html`<button class=${h === hours ? 'on' : ''} data-testid=${`tl-${h}h`} onClick=${() => set({ h: String(h) })}>${h}h</button>`)}</span></span></div>
      <div class="lanes" style="margin-top:14px">
        ${lanes.map((l, k) => html`<div class="lane" data-testid=${`tl-lane-${k + 1}`} tabindex="0" onMouseMove=${e => onMove(l, e)} onMouseLeave=${() => setHover(null)} onKeyDown=${e => onKey(k, e)} onBlur=${() => setKb(null)}>
          <span class="ln">${l.r.label}${l.r.key === 'main' ? null : html`<em>${laneSub(l)}</em>`}</span>
          <div class="trk" onMouseMove=${e => onMove(l, e)}>${l.blocks.map(b => html`<i class=${`${CLS(b[2])} ${tip && tip.lane === l && tip.block === b ? 'sel' : ''}`} style=${`left:${P(b[0])}%;width:${Math.max(0.3, P(b[1]) - P(b[0]))}%`}></i>`)}${l.marks.map(m => html`<u class=${m.bad ? 'bad' : ''} style=${`left:${P(m.t)}%`}></u>`)}${k === 0 && to >= now - 5000 ? html`<span class="nowline"></span>` : null}</div>
        </div>`)}
        ${tip ? html`<div class="tip" data-testid="tl-tip" style=${hover ? `position:fixed;left:${Math.min(innerWidth - 290, hover.x + 12)}px;top:${hover.y + 8}px` : 'right:0;top:214px'}><div class="h"><span>${tip.title}</span><span class="num">${durS(tip.ms)}</span></div><div class="r"><span>${tip.when}</span><span>${tip.state}</span></div>${tip.desc ? html`<div class="r"><span>${rich(tip.desc)}</span></div>` : null}</div>` : null}
      </div>
      <div class="axis" data-testid="tl-axis"><span></span><div class="ticks">${ticks.map(t => html`<span>${t}</span>`)}<span>${to >= now - 5000 ? 'now' : clock(to)}</span></div></div>
      <div class="legend" data-testid="tl-legend" style="margin-top:auto;padding-top:18px">
        <span><i class="sw w"></i>Claude working</span><span><i class="sw y"></i>Waiting on you</span><span><i class="sw s"></i>Stalls & overhead</span><span><i class="sw z"></i>Mac asleep</span>
        <span><i class="sw" style="background:var(--ink);width:3px;border-radius:1px"></i>Commit</span><span><i class="sw" style="background:var(--bad);width:3px;border-radius:1px"></i>Gate failed</span>
        <span style="margin-left:auto">Hover a block for what ran and how long</span>
      </div>
    </div>`;
  }

  // ---- where the time went, in full ---------------------------------------------------------------------------------
  function findingsOf(v, share) {
    const f = v.findings, wait = (f.longest || []).find(x => x.cat === 'waitUser');
    return [
      ['y', share.waitUser || 0, 'Waiting on you', wait ? `longest ${durS(wait.ms)}: ${wait.desc}` : 'questions, approvals and the ends of turns', 'Answer sooner, or pre-approve with a clear spec'],
      ['w', f.e2eMs, 'End-to-end runs', `${plural(f.e2eN, 'run')}${f.topSpec ? ` · ${f.topSpec.name} ran ${plural(f.topSpec.n, 'time')}` : ''}`, 'Run only the failing spec while fixing'],
      ['z', f.asleepMs, 'Mac asleep mid-work', plural(f.asleepN, 'time'), 'Keep the lid open while a build runs'],
      ['w', f.ceilingMs, 'Commands that hit the 10-minute limit', plural(f.ceilingN, 'command'), 'Split long runs or run them in the background'],
      ['w', f.pollMs, 'Polling loops', plural(f.pollN, 'loop'), 'Wait on a background run with TaskOutput'],
      ['s', share.compact || 0, 'Compacting context', plural(v.counts.compactions || 0, 'compaction'), ''],
    ].filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
  }
  function TimeView({ v, st, set }) {
    const share = st.sc === '6h' ? v.windowShare : v.share, b = buckets(share);
    const groups = GROUPS.map(([label, cats]) => [label, cats, cats.reduce((n, c) => n + (share[c] || 0), 0)]).filter(g => g[2] > 0).sort((x, y) => y[2] - x[2]);
    const max = Math.max(1, ...groups.map(g => g[2]));
    const finds = findingsOf(v, share);
    const done = (v.busyMs || 0) * (v.parallel || 1), par = (v.parallel || 1).toFixed(1);
    const share100 = ms => (b.clock ? Math.round((100 * ms) / b.clock) : 0);
    const lt1 = n => (n < 1 && n > 0 ? '<1' : n);
    const [hover, setHover] = useState(null);
    const pinned = (String(PIN || '').match(/^time-row-(\d+)$/) || [])[1];
    const tipRow = hover != null ? hover : pinned ? Number(pinned) - 1 : null;
    const subsOf = ([label, cats, ms]) => {
      if (cats.includes('test') && v.findings.e2eMs) { const e2e = Math.min(share.test || 0, v.findings.e2eMs); return [['End-to-end tests', `${dur(e2e)} · ${plural(v.findings.e2eN, 'run')}`], ['Other tests', dur((share.test || 0) - e2e)], ['Type checks & lint', dur(share.typecheck || 0)]].filter(x => x[1] !== '0s'); }
      return cats.filter(c => share[c]).map(c => [CAT[c] || c, dur(share[c])]);
    };
    const headline = html`${Number(par) >= 1.5 ? html`<b>${par}× in parallel</b>: ` : ''}${dur(done)} of work in ${dur(b.clock)}.${finds[0] ? html` Biggest drag: <b>${dur(finds[0][1])} ${finds[0][2].toLowerCase()}</b>${finds[1] ? `, then ${finds[1][2].toLowerCase()}` : ''}.` : ''}`;
    return html`<div class="tw">
      <div class="card split">
        <div class="lead">
          <div class="stat" data-testid="time-clock"><div class="v num">${dur(b.clock)}</div><div class="l">on the clock</div></div>
          <div class="stat" data-testid="time-done"><div class="v num">${dur(done)}<small>${par}×</small></div><div class="l">of work done, in parallel</div></div>
          <div class="headline" data-testid="time-headline">${headline}</div>
          <span class="scope"><button class=${st.sc === '6h' ? '' : 'on'} data-testid="scope-session" onClick=${() => set({ sc: null })}>This session</button><button class=${st.sc === '6h' ? 'on' : ''} data-testid="scope-6h" onClick=${() => set({ sc: '6h' })}>Last 6h</button></span>
        </div>
        <div class="sbar" data-testid="time-bar" role="img" aria-label=${`Claude working ${fmMin(b.work, 1)}, waiting on you ${fmMin(b.you, 1)}, stalls ${fmMin(b.stall, 1)}`}><i class="w" style=${`flex:${b.work}`}></i><i class="y" style=${`flex:${b.you}`}></i><i class="s" style=${`flex:${b.stall}`}></i></div>
        <div class="legend" data-testid="time-legend"><span><i class="sw w"></i>Claude working <b class="num">${fmMin(b.work)}</b> ${lt1(share100(b.work))}%</span><span><i class="sw y"></i>Waiting on you <b class="num">${fmMin(b.you)}</b> ${lt1(share100(b.you))}%</span><span><i class="sw s"></i>Stalls & overhead <b class="num">${fmMin(b.stall)}</b> ${lt1(share100(b.stall))}%</span></div>
      </div>
      <div class="tw-grid">
        <div class="card panel" style="overflow:visible;position:relative">
          <div class="ph"><span data-testid="work-title">Where Claude's working time went</span><span class="r num" data-testid="work-total">${dur(b.work)}</span></div>
          ${groups.map((g, k) => html`<button class=${`brow ${tipRow === k ? 'hov' : ''}`} data-testid=${`time-row-${k + 1}`} onMouseEnter=${() => setHover(k)} onMouseLeave=${() => setHover(null)} onFocus=${() => setHover(k)} onBlur=${() => setHover(null)}><span>${g[0]}</span><span class="tr"><i style=${`width:${(100 * g[2]) / max}%`}></i></span><span class="du num">${dur(g[2])}</span><span class="pc num">${b.work ? lt1(Math.round((100 * g[2]) / b.work) || (g[2] ? 0.5 : 0)) : 0}%</span></button>`)}
          ${tipRow != null && groups[tipRow] ? html`<div class="tip" data-testid="time-tip" style=${`left:240px;top:${68 + tipRow * 33 + 17}px`}><div class="h"><span>${groups[tipRow][0]}</span><span class="num">${dur(groups[tipRow][2])}</span></div>${subsOf(groups[tipRow]).map(([a, x]) => html`<div class="r"><span>${a}</span><span class="num">${x}</span></div>`)}</div>` : null}
        </div>
        <div class="card panel">
          <div class="ph"><span data-testid="slow-title">What slowed it down</span><span class="r" data-testid="slow-sub">biggest first</span></div>
          ${finds.length ? finds.map(([k, ms, t, x, fix], i) => html`<div class="find" data-testid=${`finding-${i + 1}`}><div class="m num"><i class=${`sw ${k}`}></i>${dur(ms)}</div><div><div class="t">${t}</div><div class="x">${x}</div>${fix ? html`<div class="fix">${fix}</div>` : null}</div></div>`) : html`<div style="color:var(--muted)" data-testid="slow-none">Nothing stood out.</div>`}
          <div class="subh" data-testid="long-title">Longest single steps</div>
          ${(v.findings.longest || []).slice(0, 4).map((x, i) => html`<div class="long" data-testid=${`long-${i + 1}`}><b class="num">${durS(x.ms)}</b><span class="lt">${x.desc}</span><em>${CAT[x.cat] || x.cat}</em></div>`)}
        </div>
      </div>
    </div>`;
  }

  // ---- log ----------------------------------------------------------------------------------------------------------
  // Events by default (plus whatever is running right now); every tool call is one click away.
  const LOG_FILTERS = [['all', 'Events'], ['gate', 'Gate'], ['commits', 'Commits'], ['problems', 'Problems'], ['tools', 'Every tool call']];
  function LogView({ v, st, set }) {
    const now = NOW(), f = st.lf || 'all', limit = Number(st.ln) || 10;
    const calls = v.feed.map(x => ({ t: x.t, kind: 'step', text: x.desc, cat: x.cat, ok: x.ok, end: x.end, who: x.who }));
    const evs = v.events;
    const rows = f === 'tools' ? calls : f === 'gate' ? evs.filter(e => /^gate/.test(e.kind)) : f === 'commits' ? evs.filter(e => e.kind === 'commit')
      : f === 'problems' ? [...evs.filter(e => /gateFail|commitBlocked|guard|memory|error|gaveUp|interrupt/.test(e.kind)), ...calls.filter(c => c.ok === false)] : [...evs, ...calls.filter(c => c.end == null)];
    const list = rows.slice().sort((a, b) => b.t - a.t);
    const who = w => (w === 'proof gate' ? 'proof' : String(w || '').replace(/:.*$/, ''));
    return html`<div class="card panel" style="flex:1;margin-bottom:20px;overflow:auto">
      <div class="filters">
        ${LOG_FILTERS.map(([k, label]) => html`<button class=${`chip ${f === k ? 'on' : ''}`} data-testid=${`log-${k}`} onClick=${() => set({ lf: k === 'all' ? null : k, ln: null })}>${label}</button>`)}
        <span style="margin-left:auto;color:var(--muted);align-self:center" data-testid="log-count">Showing ${Math.min(limit, list.length)} of ${list.length}</span>
      </div>
      ${list.slice(0, limit).map((e, i) => e.kind === 'step'
        ? html`<div class=${`ev ${e.ok === false ? 'fail' : ''}`} data-testid=${`log-${i + 1}`} style="grid-template-columns:52px 20px 1fr 150px 70px"><span class="tm">${clock(e.t)}</span><${Ic} s=${e.end == null ? 'run' : e.ok === false ? 'fail' : 'done'} /><span class="tx">${rich(e.text)}</span><span class="tx" style="color:var(--muted)">${who(e.who)}</span><span class="tag">${e.end == null ? 'running' : e.cat}</span></div>`
        : html`<div class=${`ev ${/gateFail|commitBlocked|error|gaveUp/.test(e.kind) ? 'fail' : ''}`} data-testid=${`log-${i + 1}`} style="grid-template-columns:52px 20px 1fr 150px 70px"><span class="tm">${clock(e.t)}</span><${Ic} s=${{ needsInput: 'you', gateFail: 'fail', commitBlocked: 'fail', memory: 'mem', guard: 'mem', commit: 'commit', gatePass: 'done', agentDone: 'done', compact: 'tool', interrupt: 'you', error: 'fail', gaveUp: 'fail' }[e.kind] || 'tool'} /><span class="tx">${eventText(e)}</span><span class="tx" style="color:var(--muted)">${who(e.who)}</span><span class="tag">${{ gateFail: 'gate', gatePass: 'gate', commitBlocked: 'gate', memory: 'memory', guard: 'memory', commit: 'commit', compact: 'compact', agentDone: 'agent', needsInput: 'you', interrupt: 'you' }[e.kind] || e.kind}</span></div>`)}
      ${list.length ? null : html`<div style="color:var(--muted);padding:12px 0" data-testid="log-empty">${f === 'all' ? 'No events yet in this session.' : 'Nothing here yet.'}</div>`}
      ${list.length > limit ? html`<button class="linkbtn" data-testid="log-more" onClick=${() => set({ ln: String(limit + 40) })}>Show ${Math.min(40, list.length - limit)} earlier</button>` : null}
    </div>`;
  }

  // ---- the app ----------------------------------------------------------------------------------------------------------
  let NOW = () => Date.now();
  let DATA_WINDOW = () => 6 * 3600e3;
  let SET = () => {};
  const readHash = () => Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  const writeHash = st => { const q = new URLSearchParams(Object.entries(st).filter(([, x]) => x != null && x !== '')).toString(); history.replaceState(null, '', `${location.pathname}${location.search}${q ? `#${q}` : ''}`); };

  function App() {
    const [data, setData] = useState(EMBEDDED && !EMBEDDED.moments ? EMBEDDED : EMBEDDED && EMBEDDED.moments ? EMBEDDED.moments[EMBEDDED.moments.length > 1 ? 1 : 0].data : null);
    const [lastOk, setLastOk] = useState(FROZEN ? 0 : Date.now());
    const [failed, setFailed] = useState(false);
    const [, tick] = useState(0);
    const [st, setSt] = useState(readHash());
    // set(patch) or set(prev => patch): the second form decides from the latest state (Esc right after a click).
    const set = patch => setSt(prev => { const next = { ...prev, ...(typeof patch === 'function' ? patch(prev) : patch) }; for (const k of Object.keys(next)) if (next[k] == null) delete next[k]; writeHash(next); return next; });
    SET = set;

    useEffect(() => {
      if (EMBEDDED) return;
      let alive = true, timerId;
      const pull = async () => {
        try {
          const r = await fetch(DATA_URL || `data.json?hours=${Number(st.h) || 6}`, { cache: 'no-store' });
          if (!r.ok) throw new Error(String(r.status));
          const j = await r.json();
          if (!alive) return;
          setData(j); setLastOk(DATA_URL ? j.now - 2000 : Date.now()); setFailed(false);
        } catch { if (alive) setFailed(true); }
        if (alive && !DATA_URL) timerId = setTimeout(pull, 2000);
      };
      pull();
      return () => { alive = false; clearTimeout(timerId); };
    }, [st.h]);
    useEffect(() => { if (FROZEN) return; const i = setInterval(() => tick(x => x + 1), 1000); return () => clearInterval(i); }, []);
    useEffect(() => { const on = () => setSt(readHash()); addEventListener('hashchange', on); return () => removeEventListener('hashchange', on); }, []);
    useEffect(() => {
      const onKey = e => {
        if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); set({ m: '1' }); return; }
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const k = e.key.toLowerCase();
        if (/^[1-4]$/.test(k) && data) { const tab = tabsFor(data.sessions, data.sessions.find(x => x.id === st.s) || data.sessions[0])[Number(k) - 1]; if (tab) set({ s: tab.id, v: null, d: null, m: null }); return; }
        if (k === 'backspace' && (st.v === 'job' || st.v === 'memory')) { set({ v: null, j: null, all: null }); return; }
        if (k === 'escape') set(p => (p.m ? { m: null, q: null } : p.d ? { d: null } : { v: null, j: null, all: null }));
        else if (k === 't' || k === 'w' || k === 'l') { const d = { t: 'timeline', w: 'time', l: 'log' }[k]; set({ d: st.d === d ? null : d, v: null }); }
      };
      addEventListener('keydown', onKey);
      return () => removeEventListener('keydown', onKey);
    });

    DATA_WINDOW = () => (data && data.windowMs) || 6 * 3600e3;
    NOW = () => (data ? (FROZEN ? data.now : data.now + (Date.now() - lastOk)) : Date.now());
    const offline = SIM === 'offline' || (failed && !FROZEN);
    if (SIM === 'loading') return html`<${Loading} />`;
    if (!data) return DATA_URL ? null : html`<${Loading} />`;   // a fixed feed loads at once; no skeleton to catch mid-load
    const sessions = data.sessions;
    const sel = sessions.find(x => x.id === st.s) || sessions[0];
    const live = !offline && !FROZEN || (DATA_URL && !offline);
    const sys = data.machine && data.machine.system;
    const banner = sys && sys.pct >= sys.warnPct && !offline;
    const updated = `Updated ${Math.max(1, Math.round(((FROZEN ? data.now : Date.now()) - lastOk) / 1000))}s ago`;
    if (!sel) return html`<div class="app st-none"><${Top} st=${st} set=${set} data=${data} live=${live} /><div class="main"><${V1}><${Empty} set=${set} st=${st} /><//></div></div>`;
    // The top glow: green while Claude works, coral when it needs you, amber past the memory warning line, none otherwise.
    const glow = offline ? 'none' : NEEDS(sel.status.state) ? 'you' : banner ? 'warn' : BUSY(sel.status.state) ? 'run' : 'none';
    return html`<div class=${`app st-${glow}`}>
      <${Top} st=${st} set=${set} data=${data} sel=${sel} live=${live} />
      <${V1} inline=${true}>
      ${st.m ? html`<${Menu} data=${data} sel=${sel} st=${st} set=${set} />` : null}
      ${data.replay ? html`<div class="banner off" data-testid="replay-banner"><div class="bt"><div data-testid="replay-title"><b>Replay of your ${data.replay.source || 'build'} build</b>, as the dashboard showed it at ${clock(data.now)}.</div><div class="bs" data-testid="replay-sub">Live, it refreshes every 2 seconds and the timers tick.${data.machine && data.machine.example ? ' The memory figures are sample data: Claude Code\'s logs don\'t record memory.' : ''}</div></div></div>` : null}
      ${offline ? html`<${Offline} lastOk=${lastOk} data=${data} />` : banner && st.v !== 'memory' ? html`<${MemBanner} data=${data} set=${set} />` : null}
      <//>
      <div class="main">
        <${V1}>${offline ? html`<div class="body dim" aria-hidden="true"><${Head} v=${sel} /><${StatusCard} v=${sel} /></div>`
          : st.v === 'memory' && data.machine ? html`<${MemoryView} data=${data} sel=${sel} set=${set} />`
          : st.v === 'job' && st.j ? html`<${JobView} v=${sel} who=${st.j} st=${st} set=${set} />`
          : html`<${Home} v=${sel} st=${st} set=${set} banner=${banner} />`}<//>
        <${FootBar} st=${st} set=${set} v=${offline ? null : sel} updated=${updated} />
      </div>
    </div>`;
  }

  function Loading() {
    const sk = (w, h, extra = '') => html`<div class="sk" style=${`width:${w};height:${h}px;${extra}`}></div>`;
    return html`<div class="app st-none"><div class="v1" style="margin:0"><div class="bar"><${Logo} live=${false} />${sk('180px', 30, 'border-radius:999px')}${sk('210px', 30, 'border-radius:999px;margin-left:6px')}${sk('170px', 30, 'border-radius:999px;margin-left:6px')}<div class="spacer"></div><span data-testid="loading-text" style="color:var(--muted)">Reading session logs…</span></div>
      <div class="body">${sk('360px', 26)}<div class="card status">${sk('100%', 56)}</div>
        <div class="grid"><div class="card panel">${sk('40%', 16)}<div style="height:16px"></div>${sk('100%', 80)}<div style="height:10px"></div>${sk('100%', 80)}<div style="height:10px"></div>${sk('100%', 80)}</div><div class="card panel">${sk('30%', 16)}<div style="height:16px"></div>${[1, 2, 3, 4, 5, 6, 7].map(() => sk('100%', 22, 'margin-bottom:12px'))}</div></div>
        <div class="drawer"></div></div></div></div>`;
  }

  function Empty({ st, set }) {
    const h = Number(st.h) || 6;
    return html`<div class="body"><div class="empty">
      <div class="glyph" data-testid="empty-glyph">${SVG.inbox}</div>
      <div class="e1" data-testid="empty-title">No Claude Code sessions in the last ${h} hours</div>
      <div class="e2" data-testid="empty-sub">Start one in any project and it appears here within a couple of seconds. Sessions that ran earlier show up if you widen the window.</div>
      <span class="scope" style="margin-top:8px"><button class=${h === 6 ? 'on' : ''} data-testid="empty-6h" onClick=${() => set({ h: null })}>6 hours</button><button class=${h === 24 ? 'on' : ''} data-testid="empty-24h" onClick=${() => set({ h: '24' })}>24 hours</button></span>
    </div></div>`;
  }

  function MemBanner({ data, set }) {
    const s = data.machine.system, a = data.machine.advice || {};
    const apps = (a.userApps || []).slice(0, 2);
    const free = apps.reduce((n, x) => n + x.mb, 0);
    return html`<div class="banner" data-testid="mem-banner">
      <${Ic} s="warn" id="mem-banner-icon" lg=${true} />
      <div class="bt"><div data-testid="mem-banner-title"><b>Memory is at ${pct(s.pct)}: ${(s.usedMB / 1024).toFixed(1)} of ${Math.round(s.totalMB / 1024)} GB.</b> Runs and agents now wait their turn.</div>
        ${apps.length ? html`<div class="bs" data-testid="mem-banner-advice">Closing ${apps.map(x => `${x.name} (${gb(x.mb)})`).join(' and ')} would free about ${gb(free)}, so checks and agents run side by side again.</div>` : null}</div>
      <button class="btn" data-testid="mem-banner-open" onClick=${() => set({ v: 'memory' })}>What's using it</button>
    </div>`;
  }

  // ---- one agent, or the main thread, on its own ------------------------------------------------------------------
  const CAT = { model: 'Thinking', edit: 'Editing code', read: 'Reading & searching', test: 'Tests', typecheck: 'Type checks & lint', fidelity: 'Screens & browser', build: 'Builds & installs', devserver: 'Dev servers', gate: 'proof gate', hooks: 'Other hooks', git: 'Git', subagent: 'Subagents', plan: 'Planning', web: 'Web lookups', api: 'API errors', compact: 'Compacting context', shell: 'Other commands', waitUser: 'Waiting on you' };
  // Consecutive tool calls of the same kind make one step: "Editing code, 5m".
  function phases(calls, now) {
    const out = [];
    for (const c of calls.slice().sort((a, b) => a.t - b.t)) {
      const last = out[out.length - 1];
      if (last && last.cat === c.cat) last.calls.push(c); else out.push({ cat: c.cat, calls: [c] });
    }
    return out.map(p => ({ label: CAT[p.cat] || p.cat, ms: Math.max(...p.calls.map(c => c.end ?? now)) - p.calls[0].t, running: p.calls.some(c => c.end == null), failed: p.calls.some(c => c.ok === false) }));
  }
  function JobView({ v, who, st, set }) {
    const now = NOW(), main = who === 'main', name = main ? 'Main thread' : who;
    const n = v.now.find(x => x.who === name), u = main ? null : unitFor(v, who);
    const calls = v.feed.filter(f => f.who === name);
    const working = n && n.state === 'working', el = working ? now - n.since : 0, past = el >= 5 * 60e3;
    const label = String((n && n.label) || ''), cut = label.indexOf(' · ');
    const steps = main && v.tasks.length ? v.tasks.map(t => ({ label: t.subject, ms: null, running: t.status === 'in_progress', failed: false, todo: t.status === 'pending' })) : phases(calls, now);
    const shown = calls.slice(0, 6 + (Number(st.all) || 0));
    const start = u ? u.start : main ? v.start : (calls[calls.length - 1] || { t: now }).t;
    return html`<div class="body" style="padding-bottom:20px">
      <div class="crumb"><button class="back" data-testid="back" onClick=${() => set({ v: null, j: null, all: null })}>${SVG.left}${v.title}</button><span data-testid="crumb-here">${name}</span></div>
      <div class="card status">
        <${Ic} s=${working ? 'run' : main ? iconOf(v) : 'done'} id="status-icon" lg=${true} />
        <div style="flex:1"><div class="big" data-testid="status-text">${main ? statusText(v, now) : working ? (cut > 0 ? label.slice(0, cut) : label) : 'Finished'}</div><div class="sub" data-testid="status-sub">${working && cut > 0 ? html`<code>${label.slice(cut + 3)}</code>` : working ? '' : u && u.end ? `Ran for ${dur(u.end - u.start)}` : statusSub(v, now)}</div></div>
        ${working ? html`<div class="timer num" data-testid="status-timer" style=${past ? 'color:var(--warn-ink)' : ''}>${timer(el)}</div>
          <div class="prog" data-testid="status-limit"><div class="row"><span>Against the 10-minute limit</span><b class="num">${pct(Math.min(100, el / 6000))}</b></div><div class=${`tbar ${past ? 'warn' : ''}`} style="margin:0;height:6px"><i style=${`width:${Math.min(100, el / 6000).toFixed(0)}%`}></i></div></div>` : null}
      </div>
      <div class="grid" style="grid-template-columns:270px 1fr 340px">
        <div class="card panel">
          <div class="ph"><span data-testid="steps-title">Steps</span><span class="r num" data-testid="steps-total">${dur(now - start)}</span></div>
          ${steps.length > 12 ? html`<div class="glabel" data-testid="steps-earlier" style="margin:0 0 6px">${plural(steps.length - 12, 'earlier step')}</div>` : null}
          <ul class="steps">${steps.slice(-12).map((p, k) => html`<li class=${p.running ? 'c' : p.todo ? '' : 'd'} data-testid=${`jstep-${k + 1}`}><${Ic} s=${p.running ? 'run' : p.todo ? 'todo' : p.failed ? 'fail' : 'done'} />${p.label}${p.ms != null ? html`<span class="who num">${dur(p.ms)}</span>` : null}</li>`)}</ul>
        </div>
        <div class="card panel" style="overflow:auto">
          <div class="ph"><span data-testid="activity-title">Activity</span><span class="r" data-testid="activity-sub">every tool call, newest first</span></div>
          ${shown.map((f, k) => html`<div class=${`ev ${f.ok === false ? 'fail' : ''}`} data-testid=${`act-${k + 1}`}><span class="tm">${clock(f.t)}</span><${Ic} s=${f.end == null ? 'run' : f.ok === false ? 'fail' : 'done'} /><span class="tx">${rich(f.desc)}</span><span class="tag num">${f.end == null ? timer(now - f.t) : durS(f.end - f.t)}</span></div>`)}
          ${calls.length > shown.length ? html`<button class="linkbtn" data-testid="act-more" onClick=${() => set({ all: String((Number(st.all) || 0) + 40) })}>Show ${Math.min(40, calls.length - shown.length)} earlier</button>` : null}
        </div>
        <div style="display:flex;flex-direction:column;gap:var(--s4);min-height:0">
          ${main ? null : html`<div class="card panel">
            <div class="ph"><span data-testid="brief-title">Brief</span><span class="r" data-testid="brief-sub">what it was asked</span></div>
            <div data-testid="brief-text" style="color:var(--ink-2)">${(u && u.prompt) || 'Not recorded in the log'}</div>
          </div>`}
          ${u && u.result ? html`<div class="card panel">
            <div class="ph"><span data-testid="result-title">Result</span><span class="r" data-testid="result-sub">its last message</span></div>
            <div data-testid="result-text" style="color:var(--ink-2)">${u.result}</div>
          </div>` : null}
          <div class="card panel" style="flex:1">
            <div class="ph"><span data-testid="output-title">Output</span></div>
            <div class="kv num" data-testid="output-facts"><span>Commits</span><b>${u ? u.commits : v.commits.filter(c => c.who === name).length}</b><span>Errors</span><b>${u ? u.errors || 0 : calls.filter(c => c.ok === false).length}</b><span>Worktree</span><b class="mono">${(n && n.where) || (u && u.where) || v.project}</b><span>Started</span><b>${ago(now - start)}</b><span>Result</span><b>${working || (main && BUSY(v.status.state)) ? 'Still running' : 'Done'}</b></div>
          </div>
        </div>
      </div>
    </div>`;
  }

  // ---- every session, by project -------------------------------------------------------------------------------------
  function Menu({ data, sel, st, set }) {
    const now = NOW(), q = String(st.q || '').toLowerCase();
    const match = x => !q || x.title.toLowerCase().includes(q) || String(x.project).toLowerCase().includes(q);
    const pinned = data.sessions.filter(x => NEEDS(x.status.state) && match(x));
    // Projects with a session that needs you first, then in feed order.
    const projects = [...new Set([...data.sessions.filter(x => NEEDS(x.status.state)), ...data.sessions].map(x => x.project))].map(p => [p, data.sessions.filter(x => x.project === p)])
      .map(([p, all]) => [p, all, all.filter(x => !NEEDS(x.status.state) && match(x))]).filter(([p, , rows]) => rows.length || (q && String(p).toLowerCase().includes(q)));
    const order = [...pinned, ...projects.flatMap(([, , rows]) => rows)];
    const [cur, setCur] = useState(0);
    const pin = (String(PIN || '').match(/^menu-item-(\d+)$/) || [])[1];
    const active = pin ? Number(pin) - 1 : cur;
    const open = x => set({ s: x.id, m: null, q: null, v: null, d: null });
    const what = x => {
      const ms = now - (x.status.since || x.last), st = x.status.state;
      if (x === sel) return 'open now';
      if (NEEDS(st)) return `asked ${coarse(ms)} ago`;
      if (st === 'agents') return plural(runningJobs(x).length || x.status.agents || 0, 'agent');
      if (st === 'thinking') return 'thinking';
      if (st === 'working') return 'working';
      if (st === 'stalled') return `quiet ${coarse(ms)}`;
      return `finished ${coarse(ms)} ago`;
    };
    let n = 0;
    const row = x => { const k = n++; return html`<button class=${`mi ${k === active ? 'hov' : ''}`} data-testid=${`menu-item-${k + 1}`} role="menuitem" onMouseEnter=${() => setCur(k)} onClick=${() => open(x)}><${Ic} s=${iconOf(x)} /><span class="mt">${x.title}</span><span class="ms">${what(x)}</span></button>`; };
    const onKey = e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); setCur(c => Math.min(order.length - 1, c + 1)); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setCur(c => Math.max(0, c - 1)); }
      else if (e.key === 'Enter' && order[active]) open(order[active]);
      else if (e.key === 'Escape') { e.stopPropagation(); set(q ? { q: null } : { m: null }); }
    };
    const ref = useRef(null);
    useEffect(() => { if (ref.current && !PIN) ref.current.focus(); }, []);
    return html`<div class="scrim" onClick=${() => set({ m: null, q: null })}></div><div class="menu" style="left:min(760px, calc(100vw - 486px))" role="menu">
      <label class="msearch"><span class="ic" style="color:var(--muted)" aria-hidden="true" data-testid="menu-search-icon">${SVG.search}</span><input ref=${ref} data-testid="menu-search" value=${st.q || ''} placeholder="Find a session or project" aria-label="Find a session or project" onInput=${e => { setCur(0); set({ q: e.currentTarget.value || null }); }} onKeyDown=${onKey} /><span class="k" data-testid="menu-search-key">Ctrl K</span></label>
      <div class="mscroll">
        ${pinned.length ? html`<div class="mh" data-testid="menu-group-needs-you">Needs you</div>${pinned.map(row)}` : null}
        ${projects.map(([p, all, rows], k) => html`<div class="mp" data-testid=${`menu-project-${k + 1}`}><span class="ic" style="color:var(--muted)" aria-hidden="true">${SVG.folder}</span>${p}<em>${plural(all.length, 'session')}</em></div>${rows.map(row)}`)}
        ${order.length ? null : html`<div class="mh" data-testid="menu-none" style="text-transform:none;letter-spacing:0;font-weight:400">No session or project matches</div>`}
      </div>
      <div class="mfoot" data-testid="menu-foot"><span class="k">↑</span><span class="k">↓</span> move <span class="k">Enter</span> open <span class="k">Esc</span> close</div>
    </div>`;
  }

  // ---- memory -------------------------------------------------------------------------------------------------------
  const PRESSURE = { normal: 'Normal', warn: 'Warning', critical: 'Critical' };
  const runFor = ms => (ms >= 3600e3 ? dur(ms) : durS(ms));
  // A memory event, in a few words: what proof held back, for which session, and how much it needed.
  function stopOf(e, title) {
    const t = String(e.text || '');
    const what = /agent/i.test(t) ? 'Held back an agent' : /not starting|didn't start|did not start/i.test(t) ? `Didn't start a ${(t.match(/this ([\w-]+(?: [\w-]+)?) run/) || [, 'test'])[1]} run` : /stopp/i.test(t) ? 'Stopped a run' : 'Memory';
    const need = (t.match(/needs about ([\d.]+ [MG]B)/) || [])[1] || '';
    return { t: e.t, what, title, need };
  }
  function MemoryView({ data, sel, set }) {
    const m = data.machine, s = m.system, now = NOW(), over = s.pct >= s.warnPct;
    const samples = m.samples && m.samples.length ? m.samples : [[now, s.pct]];
    const t0 = samples[0][0], span = Math.max(1, now - t0);
    const W = 820, H = 210, y = p => H - ((Math.max(40, Math.min(100, p)) - 40) / 60) * H, x = t => ((t - t0) / span) * W;
    const line = samples.map(([t, p], i) => `${i ? 'L' : 'M'}${x(t).toFixed(1)},${y(p).toFixed(1)}`).join('');
    // Axis labels every 90 minutes on the local clock (09:00, 10:30, …), then "now".
    const day0 = new Date(t0).setHours(0, 0, 0, 0), marks = [];
    for (let t = day0 + Math.ceil((t0 - day0) / 5400e3) * 5400e3; t < now - 1800e3; t += 5400e3) marks.push(clock(t));
    const apps = (m.apps || []).slice(0, 6), top = Math.max(1, ...apps.map(a => a.mb));
    const userApps = ((m.advice || {}).userApps || []).slice(0, 2), free = userApps.reduce((n, a) => n + a.mb, 0);
    const stops = newest(data.sessions.flatMap(v => v.events.filter(e => e.kind === 'memory' || e.kind === 'guard').map(e => stopOf(e, v.title))).filter(x => x.what !== 'Memory'), 4);
    return html`<div class="body" style="padding-bottom:20px">
      <div class="crumb"><button class="back" data-testid="back" onClick=${() => set({ v: null })}>${SVG.left}${sel.title}</button><span data-testid="crumb-here">Memory, this Mac</span></div>
      <div class="card" style="padding:20px 24px">
        <div style="display:flex;align-items:center;gap:16px">
          <${Ic} s=${over ? 'warn' : 'mem'} id="mem-icon" lg=${true} />
          <div style="flex:1"><div style="font-size:var(--fs-2xl);font-weight:600;letter-spacing:-.015em" data-testid="mem-title">${pct(s.pct)} used: ${(s.usedMB / 1024).toFixed(1)} of ${Math.round(s.totalMB / 1024)} GB</div><div style="color:var(--muted)" data-testid="mem-sub">${over ? `Past the ${s.warnPct}% warning line. proof holds the Mac under ${s.ceilingPct}%, so new runs and agents wait their turn.` : `Under the ${s.warnPct}% warning line. proof holds the Mac under ${s.ceilingPct}%.`}</div></div>
          <div class="kv num" style="width:250px" data-testid="mem-facts"><span>Headroom to ceiling</span><b>${gb(Math.max(0, s.headroomMB))}</b><span>Swap in use</span><b>${gb(s.swapMB || 0)}</b><span>Memory pressure</span><b>${PRESSURE[s.pressure] || 'Normal'}</b></div>
        </div>
        <div class="gauge" data-testid="mem-gauge"><i style=${`width:${Math.min(100, s.pct)}%`}></i><span class="mk" style=${`left:${s.warnPct}%`}></span><span class="mkl" style=${`left:${s.warnPct}%`}>Warning ${s.warnPct}%</span><span class="mk" style=${`left:${s.ceilingPct}%`}></span><span class="mkl" style=${`left:${s.ceilingPct}%`}>Ceiling ${s.ceilingPct}%</span></div>
      </div>
      <div class="grid" style="grid-template-columns:1fr 440px">
        <div class="card panel" style="display:flex;flex-direction:column">
          <div class="ph"><span data-testid="hist-title">Last ${plural(Math.ceil(span / 3600e3), 'hour')}</span><span class="r" data-testid="hist-scale">% of memory used</span></div>
          <div class="chart" style="height:210px;margin:8px 0 6px" data-testid="hist-chart" role="img" aria-label=${`Memory used went from ${pct(samples[0][1])} to ${pct(s.pct)}`}>
            <svg viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none">
              <line x1="0" x2=${W} y1=${y(s.ceilingPct)} y2=${y(s.ceilingPct)} stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
              <line x1="0" x2=${W} y1=${y(s.warnPct)} y2=${y(s.warnPct)} stroke="var(--warn)" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
              <path d=${`${line}L${x(samples[samples.length - 1][0])},${H}L0,${H}Z`} fill="var(--hl)"/>
              <path d=${line} fill="none" stroke="var(--ink-2)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
              <circle cx=${x(samples[samples.length - 1][0])} cy=${y(samples[samples.length - 1][1])} r="4" fill=${over ? 'var(--warn)' : 'var(--ink-2)'} stroke="var(--surface)" stroke-width="2"/>
            </svg>
            <span class="cl" style=${`top:${(y(s.ceilingPct) / H) * 100}%`}>Ceiling ${s.ceilingPct}%</span>
            <span class="cl" style=${`top:${(y(s.warnPct) / H) * 100}%`}>Warning ${s.warnPct}%</span>
          </div>
          <div class="axis" style="grid-template-columns:1fr;margin:0" data-testid="hist-axis"><div class="ticks">${marks.map(l => html`<span>${l}</span>`)}<span>now</span></div></div>
          <div class="subh" data-testid="runs-title">Claude's runs, the ones proof may stop</div>
          ${(m.runs || []).length ? html`<div class="run-row h" data-testid="runs-head"><span>Command</span><span>Session</span><span>Running</span><span style="text-align:right">Memory</span></div>
          ${m.runs.slice(0, 4).map((r, k) => html`<div class="run-row" data-testid=${`run-${k + 1}`}><code>${r.command}</code><span class="m">${String(r.cwd || '').split('/').filter(Boolean).pop() || ''}</span><span class="m num">${runFor(now - r.start)}</span><span class="v num">${size(r.mb)}</span></div>`)}`
          : html`<div class="m" style="color:var(--muted)" data-testid="runs-none">None right now.</div>`}
        </div>
        <div class="card panel">
          <div class="ph"><span data-testid="apps-title">Using the most memory</span><span class="r" data-testid="apps-sub">by app</span></div>
          ${apps.map((a, k) => html`<div class=${`app-row ${a.claude ? 'claude' : ''}`} data-testid=${`app-${k + 1}`}><span class="nm">${a.name}${a.claude ? html`<em>Claude</em>` : null}</span><span class="tr"><i style=${`width:${(a.mb / top) * 100}%`}></i></span><span class="v num">${(a.mb / 1024).toFixed(1)} GB</span></div>`)}
          ${over && userApps.length ? html`<div class="advice" data-testid="apps-advice"><b>Close ${userApps.map(a => a.name).join(' and ')}</b> to free about ${gb(free)}. Checks and agents then run side by side instead of waiting their turn${(s.swapMB || 0) > 1024 ? ', and macOS stops swapping' : ''}.</div>` : null}
          ${stops.length ? html`<div class="subh" data-testid="stops-title">Stopped or held back by proof</div>${stops.map((x, k) => html`<div class="ev" data-testid=${`stop-${k + 1}`}><span class="tm">${clock(x.t)}</span><${Ic} s="mem" /><span class="tx">${x.what} <em>${x.title}</em></span><span class="tag">${x.need}</span></div>`)}` : null}
        </div>
      </div>
    </div>`;
  }

  function Offline({ lastOk, data }) {
    const since = (FROZEN ? data.now : Date.now()) - (SIM === 'offline' ? data.now - 3 * 60e3 : lastOk);
    return html`<div class="banner off" data-testid="offline-banner">
      <span class="ic lg" style="color:var(--muted)" data-testid="offline-icon">${SVG.plug}</span>
      <div class="bt"><div data-testid="offline-title"><b>Not live.</b> proof's monitor stopped responding ${plural(Math.max(1, Math.round(since / 60e3)), 'minute')} ago.</div><div class="bs" data-testid="offline-sub">What's below is the last update, from ${clock(SIM === 'offline' ? data.now - 3 * 60e3 : lastOk)}. Start it again with <code>/proof:watch</code> in any Claude Code session. The page reconnects by itself.</div></div>
      <button class="btn" data-testid="offline-copy" onClick=${e => { try { navigator.clipboard.writeText('/proof:watch'); e.currentTarget.textContent = 'Copied'; } catch {} }}>Copy /proof:watch</button>
    </div>`;
  }

  render(html`<${App} />`, document.getElementById('root'));
})();
</script>
</body>
</html>

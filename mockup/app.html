<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>proof dashboard v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ======================================================================================================
   proof dashboard v2 "Pulse": shadcn/ui base (zinc, Geist, card, badge, tabs, command, table, alert)
   with Tremor data pieces (progress rings, tracker, category bar, bar list, spark area, stacked bars).
   Every screen is a 1440×900 frame, in light and dark.
   ====================================================================================================== */
.light {
  --background: #fafafa; --card: #ffffff; --foreground: #09090b; --muted: #f4f4f5; --muted-foreground: #63636b;
  --border: #e4e4e7; --input: #e4e4e7; --secondary: #f4f4f5; --subtle: #a1a1aa; --grid: #e4e4e7; --track: #f1f1f3;
  --overlay: rgb(9 9 11 / .35);
  /* state */
  --brand: #16a34a; --run: #16a34a; --run-ink: #15803d; --run-soft: #f0fdf4; --run-line: #bbf7d0;
  --you: #ea580c; --you-ink: #c2410c; --solid-you: #c2410c; --on-solid-you: #ffffff; --you-soft: #fff7ed; --you-line: #fed7aa;
  --warn: #d97706; --warn-ink: #b45309; --warn-soft: #fffbeb; --warn-line: #fde68a;
  --bad: #dc2626; --bad-ink: #b91c1c; --bad-soft: #fef2f2; --bad-line: #fecaca;
  /* activity: 4 hues validated vs #ffffff in this order; waiting on you is neutral, orange means "needs you now" */
  --c-think: #059669; --c-work: #2563eb; --c-cmd: #0891b2; --c-check: #c026d3; --c-you: #d4d4d8; --c-idle: #a1a1aa;
  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / .05); --shadow-lg: 0 16px 48px rgb(0 0 0 / .16);
  --glow-run: rgb(22 163 74 / .06); --glow-you: rgb(234 88 12 / .09); --glow-warn: rgb(217 119 6 / .08);
}
.dark {
  color-scheme: dark;
  --background: #09090b; --card: #111113; --foreground: #fafafa; --muted: #1c1c1f; --muted-foreground: #a1a1aa;
  --border: #27272a; --input: #27272a; --secondary: #27272a; --subtle: #71717a; --grid: #232326; --track: #1f1f23;
  --overlay: rgb(0 0 0 / .6);
  --brand: #22c55e; --run: #22c55e; --run-ink: #4ade80; --run-soft: #052e16; --run-line: #14532d;
  --you: #f97316; --you-ink: #fb923c; --solid-you: #f97316; --on-solid-you: #1a0b04; --you-soft: #2a1306; --you-line: #7c2d12;
  --warn: #f59e0b; --warn-ink: #fbbf24; --warn-soft: #1f1606; --warn-line: #713f12;
  --bad: #ef4444; --bad-ink: #f87171; --bad-soft: #2a0f0f; --bad-line: #7f1d1d;
  /* activity: validated vs #09090b in this order */
  --c-think: #059669; --c-work: #2563eb; --c-cmd: #0891b2; --c-check: #d946ef; --c-you: #3f3f46; --c-idle: #52525b;
  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / .4); --shadow-lg: 0 16px 48px rgb(0 0 0 / .6);
  --glow-run: rgb(34 197 94 / .07); --glow-you: rgb(249 115 22 / .10); --glow-warn: rgb(245 158 11 / .08);
}
:root {
  --font: "Geist", ui-sans-serif, system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
  --fs-xs: 11.5px; --fs-sm: 12.5px; --fs: 13.5px; --fs-md: 14px; --fs-lg: 20px; --fs-xl: 26px; --fs-2xl: 30px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px;
  --radius: 10px; --radius-sm: 6px; --radius-md: 8px;
  --dur-fast: 120ms; --dur: 200ms; --dur-slow: 320ms; --ease: cubic-bezier(0.2, 0, 0, 1); --pulse: 1800ms;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; color: inherit; background: none; border: 0; outline: 0; }
body { background: #d4d4d8; font-family: var(--font); padding: 40px 0 80px; -webkit-font-smoothing: antialiased; }
.sheet-head { width: 1440px; margin: 0 auto 32px; }
.sheet-head h1 { font: 600 26px var(--font); letter-spacing: -.02em; color: #09090b; }
.sheet-head p { color: #3f3f46; margin-top: 6px; max-width: 900px; font-size: 14px; }
.lbl { width: 1440px; margin: 0 auto 12px; font: 600 15px var(--font); color: #18181b; display: flex; gap: 10px; align-items: baseline; }
.lbl code { font: 500 12.5px var(--mono); color: #3f3f46; }
.lbl span { font-weight: 400; color: #3f3f46; font-size: 13.5px; }
.pair { display: flex; flex-direction: column; gap: 22px; margin-bottom: 64px; }

/* ---------- frame ---------- */
.frame { width: 1440px; height: 900px; margin: 0 auto; flex-shrink: 0; background: var(--background); color: var(--foreground); border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px rgb(0 0 0 / .18); display: flex; flex-direction: column; font-size: var(--fs); line-height: 1.45; position: relative; --glow: var(--glow-run); }
.frame.st-you { --glow: var(--glow-you); } .frame.st-warn { --glow: var(--glow-warn); } .frame.st-none { --glow: transparent; }
.frame::before { content: ""; position: absolute; inset: 0 0 auto; height: 220px; background: radial-gradient(50% 100% at 50% 0, var(--glow), transparent); pointer-events: none; }
.num { font-variant-numeric: tabular-nums; }
.mf { color: var(--muted-foreground); }
code, .mono { font-family: var(--mono); font-size: 12px; }

/* ---------- top bar ---------- */
.top { height: 56px; display: flex; align-items: center; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; position: relative; z-index: 2; background: var(--background); }
.logo { font: 700 19px var(--font); letter-spacing: -.04em; margin-right: 18px; display: flex; align-items: center; }
.logo i { font-style: normal; color: var(--brand); }
.logo.off i { color: var(--muted-foreground); }
.logo:not(.off) i { animation: brand var(--pulse) var(--ease) infinite; }
@keyframes brand { 50% { opacity: .45; } }
.stab { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: var(--radius-md); font-size: var(--fs); font-weight: 500; color: var(--muted-foreground); max-width: 230px; white-space: nowrap; transition: background var(--dur-fast) var(--ease); }
.stab .t { overflow: hidden; text-overflow: ellipsis; }
.stab:hover { background: var(--muted); color: var(--foreground); }
.stab.on { background: var(--secondary); color: var(--foreground); }
.spacer { margin-left: auto; }
.sep { width: 1px; height: 20px; background: var(--border); margin: 0 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--run); flex-shrink: 0; display: inline-block; }
.dot.idle { background: transparent; box-shadow: inset 0 0 0 1.5px var(--subtle); }
.dot.you { background: var(--you); } .dot.warn { background: var(--warn); } .dot.grey { background: var(--subtle); }
.dot.live { animation: ping var(--pulse) var(--ease) infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--run) 50%, transparent); } 70%, 100% { box-shadow: 0 0 0 6px transparent; } }
@media (prefers-reduced-motion: reduce) { .dot.live, .spin, .flow, .logo i { animation: none !important; } }

/* ---------- shadcn primitives ---------- */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-xs); min-width: 0; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; border: 1px solid var(--border); color: var(--foreground); white-space: nowrap; }
.badge.run { background: var(--run-soft); border-color: var(--run-line); color: var(--run-ink); }
.badge.you { background: var(--you-soft); border-color: var(--you-line); color: var(--you-ink); }
.badge.warn { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn-ink); }
.badge.bad { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad-ink); }
.badge.solid-you { background: var(--solid-you); border-color: var(--solid-you); color: var(--on-solid-you); font-weight: 600; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; white-space: nowrap; transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease); }
.btn.out { border: 1px solid var(--input); background: var(--card); box-shadow: var(--shadow-xs); }
.btn.out:hover { background: var(--muted); }
.btn.ghost { color: var(--muted-foreground); }
.btn.ghost:hover { background: var(--muted); color: var(--foreground); }
.btn.primary { background: var(--foreground); color: var(--background); }
.btn.icon { width: 32px; padding: 0; }
.tabs { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--muted); }
.tabs button { height: 28px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; color: var(--muted-foreground); }
.tabs button.on { background: var(--card); color: var(--foreground); box-shadow: var(--shadow-xs); }
.kbd { font-family: var(--mono); font-size: 11px; height: 20px; min-width: 20px; padding: 0 5px; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; border: 1px solid var(--border); background: var(--muted); color: var(--muted-foreground); }
.alert { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--warn-line); background: var(--warn-soft); position: relative; z-index: 1; flex-shrink: 0; }
.alert.grey { border-color: var(--border); background: var(--muted); }
.alert .at { font-weight: 600; } .alert .ad { color: var(--muted-foreground); font-size: 13px; }
.alert .btn { margin-left: auto; }
.alert svg.ic { color: var(--warn); flex-shrink: 0; }
.alert.grey svg.ic { color: var(--muted-foreground); }

/* ---------- layout ---------- */
.main { flex: 1; min-height: 0; padding: 20px 24px 0; display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 1; }
.main.dim > :not(.foot-bar) { opacity: .55; filter: saturate(.6); }
.head { display: flex; align-items: center; gap: 12px; min-height: 32px; }
.head h1 { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.02em; white-space: nowrap; }
.head .meta { color: var(--muted-foreground); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head .r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.crumb { display: flex; align-items: center; gap: 6px; color: var(--muted-foreground); font-size: 13px; }
.ch { display: flex; align-items: center; gap: 8px; min-height: 24px; }
.ch h3 { font-size: var(--fs-md); font-weight: 500; white-space: nowrap; }
.ch .r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.desc { color: var(--muted-foreground); font-size: 13px; }
.grid { display: grid; gap: 16px; min-height: 0; }
.pad { padding: 18px 20px; }
.col { display: flex; flex-direction: column; min-height: 0; }

/* status card */
.status { padding: 20px; display: grid; grid-template-columns: 170px 1fr; gap: 22px; align-items: center; }
.status.wide { grid-template-columns: 170px 1fr auto; }
.status .big { font-size: var(--fs-2xl); font-weight: 600; letter-spacing: -.03em; line-height: 1.12; margin-top: 10px; }
.status .big.md { font-size: var(--fs-xl); }
.status.you { border-color: var(--you-line); box-shadow: 0 0 0 3px color-mix(in srgb, var(--you) 10%, transparent); }
.timer { font-family: var(--mono); font-size: 13px; color: var(--muted-foreground); }
.timer.lg { font-size: 34px; font-family: var(--font); font-weight: 500; letter-spacing: -.02em; color: var(--foreground); }
.leg { display: flex; flex-direction: column; gap: 9px; margin-top: 16px; font-size: 13px; max-width: 300px; }
.leg > div { display: flex; align-items: center; gap: 8px; }
.leg i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.leg b { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
.answer { border: 1px dashed var(--you-line); background: var(--you-soft); border-radius: var(--radius-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 330px; }
.answer code { color: var(--foreground); }

/* job graph */
.jn { position: absolute; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: var(--radius-md); background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-xs); font-size: 13px; font-weight: 500; white-space: nowrap; text-align: left; transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
button.jn:hover { border-color: var(--subtle); box-shadow: var(--shadow-lg); }
.jn .nm { overflow: hidden; text-overflow: ellipsis; }
.jn .d { margin-left: auto; color: var(--muted-foreground); font-family: var(--mono); font-size: 11.5px; font-weight: 400; }
.jn.run { border-color: var(--run-line); }
.jn.root { height: 42px; padding: 0 12px; border-color: var(--run-line); box-shadow: 0 0 0 3px color-mix(in srgb, var(--run) 12%, transparent); }
.jn.fail { border-color: var(--bad-line); }
.ck { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: var(--run-soft); color: var(--run-ink); flex-shrink: 0; }
.ck.bad { background: var(--bad-soft); color: var(--bad-ink); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--run) 25%, transparent); border-top-color: var(--run); animation: spin 1s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.flow { animation: flow .9s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -18; } }

/* KPI cards */
.kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.kpi .v { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -.03em; line-height: 1.15; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.kpi .v small { font-size: var(--fs-md); font-weight: 500; color: var(--muted-foreground); letter-spacing: 0; }
.kpi .foot { margin-top: auto; padding-top: 10px; }
.tracker { display: flex; gap: 3px; height: 28px; }
.tracker i { flex: 1; border-radius: 3px; background: var(--track); }
.tracker.sm { height: 22px; }
.catbar { display: flex; gap: 3px; height: 8px; }
.catbar i { border-radius: 2px; min-width: 3px; }
.prog { height: 8px; border-radius: 4px; background: var(--track); position: relative; }
.prog i { display: block; height: 100%; border-radius: 4px; }
.prog b { position: absolute; top: -4px; width: 2px; height: 16px; border-radius: 1px; background: var(--foreground); }
.hatch { background: repeating-linear-gradient(135deg, var(--c-idle) 0 1.5px, transparent 1.5px 4px) !important; }

/* lists */
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: 48px 22px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.li:last-child { border-bottom: 0; }
.li .tm { font-family: var(--mono); font-size: 12px; color: var(--muted-foreground); }
.li .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ico { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--muted); color: var(--muted-foreground); }
.ico.run { background: var(--run-soft); color: var(--run-ink); } .ico.you { background: var(--you-soft); color: var(--you-ink); }
.ico.bad { background: var(--bad-soft); color: var(--bad-ink); } .ico.warn { background: var(--warn-soft); color: var(--warn-ink); }
.ico.work { background: color-mix(in srgb, var(--c-work) 14%, transparent); color: var(--c-work); }
.barlist { display: flex; flex-direction: column; gap: var(--bl-gap, 6px); }
.bl { display: grid; grid-template-columns: 1fr 64px; gap: 12px; align-items: center; font-size: 13px; }
.bl .bar { position: relative; height: var(--bl-h, 30px); display: flex; align-items: center; padding-left: 10px; }
.bl .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; opacity: .18; }
.bl .bar span { position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bl b { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.check { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
.check:last-child { border-bottom: 0; }
.cb { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--subtle); display: grid; place-items: center; flex-shrink: 0; }
.cb.on { background: var(--foreground); border-color: var(--foreground); color: var(--background); }
.cb.cur { border-color: var(--run); }
.check.done .ct { color: var(--muted-foreground); text-decoration: line-through; text-decoration-color: var(--subtle); }
.check .who { margin-left: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted-foreground); height: 36px; border-bottom: 1px solid var(--border); padding: 0 8px; }
.tbl td { height: 40px; border-bottom: 1px solid var(--border); padding: 0 8px; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .rt { text-align: right; }

/* charts */
.tleg { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted-foreground); flex-wrap: wrap; }
.tleg span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tleg i { width: 8px; height: 8px; border-radius: 50%; }
svg text { font-family: var(--font); }

/* footer drawer bar */
.foot-bar { height: 46px; margin: auto -24px 0; padding: 0 16px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted-foreground); flex-shrink: 0; background: var(--background); }
.foot-bar .btn { color: var(--muted-foreground); }
.foot-bar .btn.on { background: var(--muted); color: var(--foreground); }
.foot-bar .r { margin-left: auto; display: flex; align-items: center; gap: 10px; }

/* sheet (drawer) */
.scrim { position: absolute; inset: 0; background: var(--overlay); z-index: 3; }
.drawer { position: absolute; left: 0; right: 0; bottom: 0; top: 196px; z-index: 4; background: var(--background); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
.drawer .dh { display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.drawer .dh .btn.on { background: var(--muted); color: var(--foreground); }
.drawer .grab { position: absolute; top: 6px; left: 50%; width: 40px; height: 4px; border-radius: 2px; background: var(--border); transform: translateX(-50%); }
.drawer .db { flex: 1; min-height: 0; padding: 18px 24px; display: flex; flex-direction: column; gap: 16px; }

/* command palette */
.cmd { position: absolute; top: 72px; left: 50%; transform: translateX(-50%); width: 620px; z-index: 4; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; }
.cmd .ci { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-bottom: 1px solid var(--border); color: var(--muted-foreground); }
.cmd .ci input { flex: 1; color: var(--foreground); font-size: 14px; height: 44px; }
.cmd .ci input::placeholder { color: var(--muted-foreground); }
.cmd .cl { padding: 6px; max-height: 560px; }
.cmd .cg { font-size: 12px; font-weight: 500; color: var(--muted-foreground); padding: 8px 10px 4px; display: flex; gap: 8px; }
.cmd .cg span + span { margin-left: auto; }
.cmd .it { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border-radius: var(--radius-md); font-size: 13.5px; text-align: left; }
.cmd .it.sel { background: var(--muted); }
.cmd .it .w { margin-left: auto; font-size: 12.5px; color: var(--muted-foreground); }
.cmd .it.you .w { color: var(--you-ink); font-weight: 500; }
.cmd mark { background: transparent; color: var(--foreground); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.cmd .cf { display: flex; align-items: center; gap: 14px; height: 40px; padding: 0 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); }
.cmd .cf span { display: inline-flex; align-items: center; gap: 6px; }

/* skeleton, empty */
.sk { background: var(--muted); border-radius: var(--radius-md); animation: skp 1.6s var(--ease) infinite; }
@keyframes skp { 50% { opacity: .55; } }
.center { position: absolute; inset: 56px 0 0; display: grid; place-items: center; z-index: 2; }
.empty { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 460px; }
.empty .eic { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); display: grid; place-items: center; color: var(--muted-foreground); box-shadow: var(--shadow-xs); margin-bottom: 6px; }
.empty h2 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }

/* spec sheet */
.spec { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.sc { padding: 16px 18px; display: grid; grid-template-columns: 54px 1fr auto; gap: 14px; align-items: center; }
.sc .st { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.sc .sn { font-size: 12.5px; color: var(--muted-foreground); margin-top: 3px; }
.sc.you { border-color: var(--you-line); }

.tip .m { color: #a1a1aa; }

</style>
</head>
<body>
<div class="sheet-head">
  <h1>proof dashboard v2: Pulse</h1>
  <p>Every screen and state, light and dark. shadcn/ui base with Tremor data pieces. Sample data follows the v1 mockup's sessions so copy and numbers line up across screens. Hover bars, blocks and nodes for tooltips.</p>
</div>
<div id="screens"></div>

<script>
(() => {
// ======================================================================================================
// sample data (deterministic): "now" is 14:34
// ======================================================================================================
const H = 3600e3, M = 60e3;
const day = new Date(2026, 9, 17, 0, 0, 0).getTime();
const at = (h, m, s = 0) => day + h * H + m * M + s * 1000;
const NOW = at(14, 34);
let seed = 7; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const pick = w => { let r = rnd() * Object.values(w).reduce((a, b) => a + b, 0); for (const [k, v] of Object.entries(w)) { if ((r -= v) <= 0) return k; } return Object.keys(w)[0]; };
// fill [a,b) with segments drawn from category weights
function fill(a, b, w, min = 15e3, max = 150e3) { const out = []; let t = a; while (t < b) { const d = Math.min(b - t, min + rnd() * (max - min)); out.push([t, t + d, pick(w)]); t += d + (rnd() < .25 ? 4e3 + rnd() * 20e3 : 0); } return out; }
const W_BUILD = { think: 4, work: 3, check: 2, cmd: 1 }, W_TEST = { think: 2, work: 2, check: 5, cmd: 1 }, W_READ = { think: 3, work: 6, cmd: 1 };

const ORDER = ['think', 'work', 'cmd', 'check', 'you', 'idle'];
const COL = { think: 'var(--c-think)', work: 'var(--c-work)', cmd: 'var(--c-cmd)', check: 'var(--c-check)', you: 'var(--c-you)', idle: 'var(--c-idle)' };
const NAME = { think: 'Thinking & writing', work: 'Reading & editing', cmd: 'Commands', check: 'Checks & screens', you: 'Waiting on you', idle: 'Stalls' };

// Checkout flow build: 12:52 → now, 3 agents running
const CK = { start: at(12, 52) };
CK.main = [...fill(at(12, 52), at(13, 5), W_READ), [at(13, 5), at(13, 14, 2), 'you'], ...fill(at(13, 14, 2), at(13, 30), W_BUILD), [at(13, 30), at(13, 37), 'you'], ...fill(at(13, 37), at(13, 58), W_BUILD), [at(13, 58), at(14, 4), 'you'], ...fill(at(14, 4), at(14, 14), W_BUILD), [at(14, 14), at(14, 17), 'idle'], ...fill(at(14, 17), at(14, 31), W_BUILD), [at(14, 31), NOW, 'cmd']];
CK.agents = [
  { id: 'explore', name: 'Explore: existing payment code', type: 'Explore', lane: 'main', start: at(13, 16), end: at(13, 20), w: W_READ, commits: 0 },
  { id: 'lane-a', name: 'Lane A unit 12: cart screen', type: 'general-purpose', lane: 'lane-a', start: at(13, 20), end: at(13, 38), w: W_BUILD, commits: 3 },
  { id: 'lane-b', name: 'Lane B unit 13: payment screen', type: 'general-purpose', lane: 'lane-b', start: at(14, 14), end: null, w: W_BUILD, now: 'Running e2e tests', detail: 'checkout.spec.ts › pays with saved card · 6:12 of 10:00 limit', since: at(14, 27, 48), commits: 2, tail: 'check' },
  { id: 'lane-c', name: 'Lane C unit 14: order API', type: 'general-purpose', lane: 'lane-c', start: at(14, 31, 20), end: null, w: W_BUILD, now: 'Editing src/api/orders.ts', since: at(14, 31, 20), commits: 1 },
  { id: 'verifier', name: 'Verifier: cart screen', type: 'proof:verifier', lane: 'main', start: at(14, 33, 12), end: null, w: W_READ, now: 'Reading cart.tsx and its acceptance criteria', since: at(14, 33, 12), commits: 0 },
];
for (const a of CK.agents) { a.segs = fill(a.start, (a.end || NOW) - (a.tail ? 6 * M + 12e3 : 0), a.w, 10e3, 90e3); if (a.tail) a.segs.push([NOW - 6 * M - 12e3, NOW, a.tail]); }
CK.gates = [[at(13, 12), 1, 'types, lint, test'], [at(13, 31), 1, 'types, lint, test'], [at(13, 38), 1, '6 checks'], [at(13, 52), 1, '6 checks'], [at(14, 5), 1, '6 checks'], [at(14, 22), 1, '6 checks in 2m 40s'], [at(14, 25), 1, '6 checks in 2m 40s'], [at(14, 27), 0, 'checkout.spec.ts › rejects expired card']];
CK.commits = [at(13, 24), at(13, 29), at(13, 36), at(13, 40), at(13, 47), at(13, 55), at(14, 2), at(14, 9), at(14, 13), at(14, 19), at(14, 25), at(14, 25, 30), at(14, 29), at(14, 33)];

// memory history: 6 hours of samples
const memSeries = (base, end) => { const out = []; let v = base; for (let t = NOW - 6 * H; t <= NOW; t += 2 * M) { v += (rnd() - .5) * 2.2 + (end - v) * .012; out.push([t, Math.max(40, Math.min(95, v))]); } out[out.length - 1][1] = end; return out; };
const MEM_OK = memSeries(58, 68), MEM_HI = memSeries(70, 85);

// ======================================================================================================
// helpers
// ======================================================================================================
const fmt = ms => { const s = Math.round(ms / 1000), m = Math.floor(s / 60); return m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m` : m >= 1 ? `${m}m` : `${s}s`; };
const clock = t => { const d = new Date(t); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const T = id => ` data-testid="${id}"`;
const sumBy = segs => { const o = {}; for (const [a, b, c] of segs) o[c] = (o[c] || 0) + (b - a); return o; };
const I = {
  check: '<svg width="9" height="9" viewBox="0 0 10 10"><path d="M2 5.2l2 2 4-4.4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x: '<svg width="9" height="9" viewBox="0 0 10 10"><path d="M3 3l4 4M7 3l-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  chev: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',
  moon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',
  sun: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  warn: '<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>',
  plug: '<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a6 6 0 0 1-12 0V8Z"/></svg>',
  back: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>',
  right: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>',
  copy: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  term: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m4 17 6-5-6-5M12 19h8"/></svg>',
  commit: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="4"/><path d="M3 12h5M16 12h5"/></svg>',
  gate: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6Z"/></svg>',
  mem: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="4" y="6" width="16" height="12" rx="2"/><path d="M8 6V3M12 6V3M16 6V3M8 21v-3M12 21v-3M16 21v-3"/></svg>',
  ask: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 9a3 3 0 1 1 4 2.8c-.6.3-1 .9-1 1.6V14M12 18h.01"/></svg>',
  shell: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m5 17 5-5-5-5M12 19h7"/></svg>',
  edit: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16Z"/></svg>',
  clock: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  compact: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 14h6v6M20 10h-6V4"/></svg>',
  inbox: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1Z"/></svg>',
};

// ======================================================================================================
// shared pieces
// ======================================================================================================
const TABS = {
  checkout: { title: 'Checkout flow build', dot: 'live' },
  admin: { title: 'Admin access on production', dot: 'you', badge: true },
  dash: { title: 'Dashboard UI redesign', dot: 'live' },
  release: { title: 'Proof v0.4.0 release', dot: 'idle' },
  docs: { title: 'API docs refresh', dot: 'grey' },
};
function topbar(o = {}) {
  const cur = o.cur || 'checkout', set = o.tabs || ['checkout', 'admin', 'dash', 'release'];
  const tabs = set.map((k, i) => { const t = TABS[k]; return `<button class="stab ${k === cur ? 'on' : ''}"${T(`tab-${i + 1}`)}><span class="dot ${t.dot === 'live' ? 'live' : t.dot}"></span><span class="t">${t.title}</span>${t.badge ? `<span class="badge solid-you" style="height:20px">needs you</span>` : ''}</button>`; }).join('');
  const memPct = o.mem || 68, hi = memPct >= 75;
  return `<div class="top"><div class="logo ${o.offline ? 'off' : ''}"${T('logo')}>proof<i>.</i></div>${o.noTabs ? '' : tabs}
    ${o.noTabs ? '' : `<button class="btn ghost"${T('more')}>+4 more ${o.hiddenYou ? `<span class="badge solid-you" style="height:20px">1 needs you</span>` : ''}${I.chev}</button>`}
    <span class="spacer"></span>
    <button class="btn out"${T('mem-pill')}><span>Memory</span><b class="num" style="color:${hi ? 'var(--warn-ink)' : 'var(--foreground)'}">${memPct}%</b>${spark(hi ? MEM_HI : MEM_OK, 60, 16, { ceiling: false, color: hi ? 'var(--warn)' : 'var(--c-think)', id: 'mem-pill-spark', noId: true })}</button>
    <span class="sep"></span>
    <button class="btn ghost icon" aria-label="Switch theme"${T('theme')}>${o.dark ? I.sun : I.moon}</button></div>`;
}
const headBlock = (title, meta, right = '') => `<div class="head"><h1${T('title')}>${title}</h1><span class="meta"${T('meta')}>${meta}</span><div class="r">${right}</div></div>`;
const rangeTabs = (on = 'Session') => `<div class="tabs"${T('range')}>${['Last hour', 'Session'].map((x, i) => `<button class="${x === on ? 'on' : ''}"${T(`range-${i + 1}`)}>${x}</button>`).join('')}</div>`;
function footBar(o = {}) {
  const b = (k, n, id) => `<button class="btn ${o.on === id ? 'on' : ''}"${T(`drawer-${id}`)}><span class="kbd">${k}</span>${n}</button>`;
  return `<div class="foot-bar">${b('T', 'Timeline', 'timeline')}${b('W', 'Where the time went', 'time')}${b('L', 'Log', 'log')}
    <div class="r">${o.gateFail ? `<span class="badge bad"${T('foot-gate')}>${I.x} 1 gate failure</span>` : ''}<span${T('updated')}>${o.updated || 'Updated 2s ago'}</span></div></div>`;
}

// rings (Tremor ProgressCircle, concentric)
function rings(vals, id = 'rings', size = 170) {
  const C = size / 2, SW = size * .07, R = [C - SW / 2 - 2, C - SW * 1.5 - 6, C - SW * 2.5 - 10];
  const svg = vals.map((r, i) => { const L = 2 * Math.PI * R[i]; return `<circle cx="${C}" cy="${C}" r="${R[i]}" fill="none" stroke="var(--track)" stroke-width="${SW}"/>${r.v > 0 ? `<circle cx="${C}" cy="${C}" r="${R[i]}" fill="none" stroke="${r.c}" stroke-width="${SW}" stroke-linecap="round" stroke-dasharray="${Math.max(.01, L * Math.min(1, r.v))} ${L}" transform="rotate(-90 ${C} ${C})" data-tip="<b>${r.n}</b> · ${r.val}"/>` : ''}`; }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"${T(id)}>${svg}</svg>`;
}
const ringLegend = (vals, pre = 'leg') => `<div class="leg">${vals.map((v, i) => `<div><i style="background:${v.c}"></i><span class="mf"${T(`${pre}-${i + 1}-name`)}>${v.n}</span><b${T(`${pre}-${i + 1}-value`)}>${v.val}</b></div>`).join('')}</div>`;

// spark area (Tremor SparkAreaChart)
function spark(series, W, Hh, o = {}) {
  const t0 = series[0][0], t1 = series[series.length - 1][0], X = t => (t - t0) / (t1 - t0) * W, Y = p => Hh - 1 - (p - 40) / 60 * (Hh - 2);
  const pts = series.map(s => `${X(s[0]).toFixed(1)},${Y(s[1]).toFixed(1)}`).join(' '), g = 'g' + Math.random().toString(36).slice(2, 7), col = o.color || 'var(--warn)';
  return `<svg width="${o.fluid ? '100%' : W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" style="overflow:visible;display:block"${o.noId ? '' : T(o.id || 'spark')}><defs><linearGradient id="${g}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="0,${Hh} ${pts} ${W},${Hh}" fill="url(#${g})"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${o.ceiling !== false ? `<line x1="0" x2="${W}" y1="${Y(93)}" y2="${Y(93)}" stroke="var(--bad)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>` : ''}</svg>`;
}

// stacked activity bars (Tremor BarChart, stacked)
function activityChart(segs, t0, t1, W, Hh, o = {}) {
  const B = o.bucket || 10 * M, n = Math.ceil((t1 - t0) / B), AX = 40, PB = 22, cw = (W - AX) / n, bw = Math.min(44, cw * .62);
  const slots = []; let max = 0;
  for (let i = 0; i < n; i++) { const a = t0 + i * B, b = Math.min(t1, a + B), acc = {}; for (const s of segs) { const ov = Math.min(b, s[1]) - Math.max(a, s[0]); if (ov > 0) acc[s[2]] = (acc[s[2]] || 0) + ov; } const tot = Object.values(acc).reduce((p, q) => p + q, 0); max = Math.max(max, tot); slots.push({ a, b, acc }); }
  const step = max > 30 * M ? 10 : max > 8 * M ? 5 : 2, top = Math.max(step, Math.ceil(max / M / step) * step), Y = m => (Hh - PB) - m / (top * M) * (Hh - PB - 8);
  let out = '';
  for (let m = 0; m <= top; m += step) out += `<line x1="${AX}" x2="${W}" y1="${Y(m * M)}" y2="${Y(m * M)}" stroke="var(--grid)" ${m ? 'stroke-dasharray="3 3"' : ''}/><text x="${AX - 10}" y="${Y(m * M) + 4}" font-size="11.5" fill="var(--muted-foreground)" text-anchor="end">${m}m</text>`;
  const every = n > 14 ? 3 : n > 8 ? 2 : 1;
  slots.forEach((s, i) => {
    const x = AX + i * cw + (cw - bw) / 2; let y = Y(0);
    const tip = ORDER.filter(f => s.acc[f]).map(f => `<span style='display:inline-block;width:8px;height:8px;border-radius:50%;background:${COL[f]};margin-right:6px'></span>${NAME[f]} <b style='float:right;margin-left:16px'>${fmt(s.acc[f])}</b>`).join('<br>');
    out += `<rect x="${AX + i * cw}" y="0" width="${cw}" height="${Hh - PB}" fill="transparent" data-tip="<b>${clock(s.a)}–${clock(s.b)}</b><br>${tip || '<span class=m>nothing ran</span>'}"/>`;
    for (const f of ORDER) { if (!s.acc[f]) continue; const h = s.acc[f] / (top * M) * (Hh - PB - 8); out += `<rect x="${x}" y="${y - h}" width="${bw}" height="${Math.max(0, h - 1.5)}" fill="${f === 'idle' ? `url(#hatch-${o.id})` : COL[f]}" pointer-events="none"/>`; y -= h; }
    if (i % every === 0) out += `<text x="${x + bw / 2}" y="${Hh - 4}" font-size="11.5" fill="var(--muted-foreground)" text-anchor="middle">${clock(s.a)}</text>`;
  });
  return `<svg width="${W}" height="${Hh}"${T(o.id || 'activity-chart')}><defs><pattern id="hatch-${o.id}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--track)"/><rect width="1.6" height="5" fill="var(--c-idle)"/></pattern></defs>${out}</svg>`;
}
const actLegend = (id = 'act-legend', keys = ORDER) => `<div class="tleg"${T(id)}>${keys.map(f => `<span><i class="${f === 'idle' ? 'hatch' : ''}" style="background:${COL[f]}"></i>${NAME[f]}</span>`).join('')}</div>`;
function activityCard(segs, t0, t1, o = {}) {
  return `<div class="card pad col" style="flex:1;min-height:0;gap:10px"${o.cardId ? T(o.cardId) : ''}><div class="ch"><h3${T('act-title')}>${o.title || 'Activity'}</h3><span class="desc"${T('act-desc')}>${o.desc || 'every 10 minutes, all agents combined'}</span>${o.legendBelow ? '' : `<span class="r">${actLegend()}</span>`}</div>
    ${o.legendBelow ? actLegend() : ''}<div data-chart="${o.chartId || 'activity'}" data-segs='${JSON.stringify(segs.map(s => [s[0], s[1], s[2]]))}' data-t0="${t0}" data-t1="${t1}" data-bucket="${o.bucket || 10 * M}" style="flex:1;min-height:0"></div></div>`;
}

// job graph (GitHub Actions run graph)
function jobGraph(agents, W, Hh, o = {}) {
  const mainW = 210, gateW = 124, x = mainW + 64, gateX = W - gateW, nodeW = gateX - 64 - x, gy = Hh / 2;
  const nh = Hh / agents.length > 38 ? 34 : 30, stepY = (Hh - nh) / Math.max(1, agents.length - 1);
  let nodes = `<button class="jn root" style="left:0;top:${gy - 21}px;width:${mainW}px" data-tip="<b>Main thread</b><br><span class=m>orchestrates, talks to you · 14 commits</span>"${T('node-main')}><span class="dot ${o.mainDot || 'idle'}"></span><span class="nm">Main thread</span><span class="badge ${o.mainBadgeCls || ''}" style="margin-left:auto;height:20px">${o.mainBadge || 'waiting on 3'}</span></button>`, wires = '';
  agents.forEach((a, i) => {
    const y = i * stepY, y1 = y + nh / 2, run = !a.end, dur = (a.end || NOW) - a.start;
    nodes += `<button class="jn ${run ? 'run' : ''}" style="left:${x}px;top:${y}px;width:${nodeW}px;height:${nh}px" data-tip="<b>${esc(a.name)}</b><br><span class=m>${a.type} · ${run ? esc(a.now) : 'done'} · ${fmt(dur)}</span>${a.detail ? `<br><span class=m>${esc(a.detail)}</span>` : ''}<br><span class=m>worktree ${a.lane} · ${a.commits} commit${a.commits === 1 ? '' : 's'}</span>"${T(`node-${a.id}`)}>${run ? '<span class="spin"></span>' : `<span class="ck">${I.check}</span>`}<span class="nm">${esc(a.name)}</span>${run ? `<span class="mf" style="font-weight:400;overflow:hidden;text-overflow:ellipsis;margin-left:6px">· ${esc(a.now)}</span>` : ''}<span class="d">${run && dur < 10 * M ? clock4(dur) : fmt(dur)}</span></button>`;

function memoryChart(W, Hh) {
  const AX = 40, PB = 22, t0 = MEM_HI[0][0], X = t => AX + (t - t0) / (NOW - t0) * (W - AX - 4), Y = p => (Hh - PB) - (p - 0) / 100 * (Hh - PB - 6);
  let out = '';

        ${[['23m', 'Waiting on you', 'longest 9m 02s: Ask you to approve the plan', 'Answer sooner, or pre-approve with a clear spec'], ['14m', 'End-to-end runs', '6 runs · checkout.spec.ts ran 4 times', 'Run only the failing spec while fixing'], ['3m', 'Compacting context', '2 compactions', '']].map(([v, n, d, tip], i) => `
          <div style="display:grid;grid-template-columns:64px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)"><div style="font-size:20px;font-weight:600;letter-spacing:-.02em"${T(`slow-${i + 1}-value`)}>${v}</div>
            <div><div style="font-weight:500"${T(`slow-${i + 1}-name`)}>${n}</div><div class="desc"${T(`slow-${i + 1}-detail`)}>${d}</div>${tip ? `<div class="desc" style="color:var(--foreground);margin-top:2px"${T(`slow-${i + 1}-tip`)}>→ ${tip}</div>` : ''}</div></div>`).join('')}</div>
    </div>`);
}
function drawerLog(o) {
  const rows = [['14:33', 'run', I.commit, 'Commit <code>9d2c41e</code> merge lane-a: cart screen', 'Main thread', 'commit'], ['14:31', 'run', '<span class="spin" style="width:10px;height:10px;border-width:1.5px"></span>', '<code>npx playwright test checkout.spec.ts</code>', 'Lane B unit 13', 'running'], ['14:27', 'bad', I.gate, 'Gate failed: checkout.spec.ts › rejects expired card', 'Lane B unit 13', 'gate'], ['14:25', 'run', I.gate, 'Gate passed: 6 checks in 2m 40s', 'proof', 'gate'], ['14:25', 'run', I.commit, 'Commit <code>a10f000</code> wire payment route', 'Main thread', 'commit'], ['14:25', 'run', I.commit, 'Commit <code>4be91a0</code> payment form', 'Lane B unit 13', 'commit'], ['14:22', 'warn', I.mem, 'Memory: held back the verifier for 40s, the Mac was at 86%', 'Main thread', 'memory'], ['14:19', 'run', I.commit, 'Commit <code>a11f010</code> checkout state machine', 'Main thread', 'commit'], ['14:13', 'run', I.commit, 'Commit <code>a12f020</code> merge lane-a: cart screen tests', 'Main thread', 'commit'], ['14:12', '', I.compact, 'Compacted context', 'Main thread', 'compact']];
  return drawerShell(o, 'log', `
    <div class="ch"><div class="tabs"${T('log-tabs')}>${['Events', 'Gate', 'Commits', 'Problems', 'Every tool call'].map((x, i) => `<button class="${i === 0 ? 'on' : ''}"${T(`log-tab-${i + 1}`)}>${x}${i === 3 ? ' <span class="badge bad" style="height:18px">1</span>' : ''}</button>`).join('')}</div><span class="r desc"${T('log-count')}>Showing 10 of 21</span></div>
    <div class="card" style="padding:0 16px;flex:1;min-height:0;overflow:hidden"${T('log-card')}><table class="tbl"><thead><tr><th style="width:70px"${T('log-h-time')}>Time</th><th${T('log-h-event')}>Event</th><th style="width:180px"${T('log-h-who')}>Who</th><th style="width:110px" class="rt"${T('log-h-kind')}>Kind</th></tr></thead><tbody>
      ${rows.map((r, i) => `<tr><td class="mono mf"${T(`log-${i + 1}-time`)}>${r[0]}</td><td><div style="display:flex;align-items:center;gap:10px"><span class="ico ${r[1]}"${T(`log-${i + 1}-icon`)}>${r[2]}</span><span${T(`log-${i + 1}-text`)}>${r[3]}</span></div></td><td class="mf"${T(`log-${i + 1}-who`)}>${r[4]}</td><td class="rt"><span class="badge ${r[5] === 'running' ? 'run' : ''}"${T(`log-${i + 1}-kind`)}>${r[5]}</span></td></tr>`).join('')}</tbody></table></div>
    <button class="btn out" style="align-self:center"${T('log-more')}>Show 11 earlier</button>`, `<span class="badge bad"${T('sheet-gate')}>${I.x} 1 gate failure</span>`);
}

// ======================================================================================================
// switcher (command palette)
// ======================================================================================================
const GROUPS = [
  { name: 'eap_multi_agent_backend', items: [['Admin access on production', 'asked 49h ago', 'you'], ['TRB test case documents review', 'finished 13h ago', 'idle'], ['Multi-agent API logs analysis', 'finished 14h ago', 'idle']] },
  { name: 'shop-app', items: [['Checkout flow build', 'open now', 'live'], ['API docs refresh', 'no activity for 18m', 'grey']] },
  { name: 'proof', items: [['Dashboard UI redesign', 'thinking', 'live'], ['Proof v0.4.0 release', 'finished 41m ago', 'idle'], ['Proof README and description improvement', 'finished 1h ago', 'idle'], ['Proof logo', 'finished 1h ago', 'idle']] },
];
function switcher(o, q = '') {
  const hl = s => q ? s.replace(new RegExp(`(${q})`, 'ig'), '<mark>$1</mark>') : s;
  const groups = q ? GROUPS.filter(g => g.name.includes(q) || g.items.some(i => i[0].toLowerCase().includes(q))) : GROUPS;
  let n = 0; const item = (it, sel) => { n++; return `<button class="it ${sel ? 'sel' : ''} ${it[2] === 'you' ? 'you' : ''}"${T(`sw-item-${n}`)}><span class="dot ${it[2]}"></span><span>${hl(it[0])}</span><span class="w">${it[1]}</span></button>`; };
  return homeWorking(o) + `<div class="scrim"${T('scrim')}></div><div class="cmd"${T('switcher')}>
    <div class="ci"><span${T('sw-icon')}>${I.search}</span><input${T('sw-search')} placeholder="Search sessions and projects" value="${q}"><span class="kbd"${T('sw-kbd')}>Ctrl K</span></div>
    <div class="cl">
      <div class="cg"><span${T('sw-group-you')}>Needs you</span></div>${item(GROUPS[0].items[0], true)}
      ${groups.map((g, gi) => `<div class="cg"><span${T(`sw-group-${gi + 1}`)}>${hl(g.name)}</span><span${T(`sw-group-${gi + 1}-count`)}>${g.items.length} session${g.items.length > 1 ? 's' : ''}</span></div>${g.items.filter(i => i[2] !== 'you' || q === '' ? i[2] !== 'you' : false).map(i => item(i)).join('')}${g.items.some(i => i[2] === 'you') ? '' : ''}`).join('')}
    </div>
    <div class="cf"><span${T('sw-hint-move')}><span class="kbd">↑</span><span class="kbd">↓</span>move</span><span${T('sw-hint-open')}><span class="kbd">Enter</span>open</span><span${T('sw-hint-close')}><span class="kbd">Esc</span>close</span></div></div>`;
}

// ======================================================================================================
// loading, offline, empty, spec sheet
// ======================================================================================================
function loading(o) {
  return topbar({ ...o, noTabs: true }) + `<div class="main">
    <div class="head"><div class="sk" style="width:260px;height:24px"></div><div class="sk" style="width:340px;height:16px"></div></div>
    <div class="grid" style="grid-template-columns:420px 1fr;height:262px"><div class="sk" style="border-radius:10px"></div><div class="sk" style="border-radius:10px"></div></div>
    <div class="grid" style="grid-template-columns:repeat(4,1fr);height:124px">${'<div class="sk" style="border-radius:10px"></div>'.repeat(4)}</div>
    <div class="sk" style="flex:1;border-radius:10px;margin-bottom:24px"></div></div>
    <div class="center"><div class="card" style="padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-lg)"${T('loading-card')}><span class="spin"></span><span${T('loading-text')}>Reading session logs…</span></div></div>`;
}
function offline(o) {
  const html = homeWorking({ ...o, offline: true });
  return html.replace('<div class="main">', `<div class="alert grey"${T('offline-banner')}><span${T('offline-icon')}>${I.plug}</span><div><div class="at"${T('offline-title')}>Not live. proof's monitor stopped responding 3 minutes ago.</div><div class="ad"${T('offline-body')}>What's below is the last update, from 14:34. Start it again with <code>/proof:watch</code> in any Claude Code session. The page reconnects by itself.</div></div><button class="btn out"${T('offline-copy')}>${I.copy}Copy /proof:watch</button></div><div class="main dim">`)
    .replace('<span class="dot live" style="width:6px;height:6px"></span>Live', '<span class="dot grey" style="width:6px;height:6px"></span>Last update 14:34').replace('class="badge run" data-testid="status-badge"', 'class="badge" data-testid="status-badge"').replace('Updated 2s ago', 'Last update 3m ago');
}
function empty(o) {
  return topbar({ ...o, noTabs: true }) + `<div class="center"><div class="empty"${T('empty')}><div class="eic"${T('empty-icon')}>${I.inbox}</div>
    <h2${T('empty-title')}>No Claude Code sessions in the last 6 hours</h2>
    <p class="desc"${T('empty-body')}>Start one in any project and it appears here within a couple of seconds. Sessions that ran earlier show up if you widen the window.</p>
    <div class="tabs" style="margin-top:8px"${T('empty-range')}><button class="on"${T('empty-range-1')}>6 hours</button><button${T('empty-range-2')}>24 hours</button></div></div></div>`;
}
function statusAll(o) {
  const cards = [
    ['working', 'Working: editing <code>src/api/orders.ts</code>', 'state working · green dot, pulsing · green glow', '0:42', 'live', ''],
    ['gate', 'Running the proof gate: 3 of 6 checks done', 'state working, cat gate · checks listed from the gate live file · green', '1:18', 'gate', ''],
    ['thinking', 'Thinking', 'state thinking · green dot, pulsing (Claude is working, nothing to watch yet)', '0:09', 'live', ''],
    ['agents', 'Working: 3 agents running', 'state agents · main thread waiting on its agents · green, rings and job graph', '6:12', 'agents', ''],
    ['approval', 'Approve a command: <code>git push --force-with-lease</code>', 'state approval · coral card, glow and tab badge "needs you" · answer in the terminal', '2:05', 'you', 'you'],
    ['ask', 'Claude asked you something', 'state needsInput · coral, same as approval', '49h 35m', 'you', 'you'],
    ['finished', 'Finished, waiting for your next message', 'state waiting · grey ring, no glow · not "needs you": the turn is over, nothing is blocked', '41m', 'idle', ''],
    ['stalled', 'No activity for 18 minutes', 'state stalled · grey clock, no glow', '18:04', 'stall', ''],
  ];
  const vis = k => k === 'live' ? `<svg width="54" height="54"><circle cx="27" cy="27" r="22" fill="none" stroke="var(--track)" stroke-width="6"/><circle cx="27" cy="27" r="22" fill="none" stroke="var(--c-think)" stroke-width="6" stroke-linecap="round" stroke-dasharray="90 200" transform="rotate(-90 27 27)"/></svg>`
    : k === 'gate' ? `<svg width="54" height="54"><circle cx="27" cy="27" r="22" fill="none" stroke="var(--track)" stroke-width="6"/><circle cx="27" cy="27" r="22" fill="none" stroke="var(--c-check)" stroke-width="6" stroke-linecap="round" stroke-dasharray="69 200" transform="rotate(-90 27 27)"/><text x="27" y="31" font-size="11" font-weight="600" text-anchor="middle" fill="var(--foreground)">3/6</text></svg>`
    : k === 'agents' ? rings(ckRingVals, 'x', 54).replace(/ data-testid="x"/, '')
    : k === 'you' ? `<svg width="54" height="54"><circle cx="27" cy="27" r="22" fill="none" stroke="var(--you)" stroke-width="6"/><circle cx="27" cy="27" r="6" fill="var(--you)"/></svg>`
    : k === 'idle' ? `<svg width="54" height="54"><circle cx="27" cy="27" r="22" fill="none" stroke="var(--subtle)" stroke-width="6"/><path d="M20 27.5l5 5 9-10" stroke="var(--muted-foreground)" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`
    : `<svg width="54" height="54"><circle cx="27" cy="27" r="22" fill="none" stroke="var(--track)" stroke-width="6"/><circle cx="27" cy="27" r="22" fill="none" stroke="var(--subtle)" stroke-width="6" stroke-dasharray="4 6"/><path d="M27 18v9l6 4" stroke="var(--muted-foreground)" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`;
  return topbar(o) + `<div class="main">
    ${headBlock('The status card in every state', 'status.state from the feed, and what the card, tab dot and glow do')}
    <div class="spec">${cards.map(([k, t, n, tm, v, cls], i) => `<div class="card sc ${cls}"${T(`state-${k}`)}><span${T(`state-${k}-visual`)}>${vis(v)}</span><div><div class="st"${T(`state-${k}-title`)}>${t}</div><div class="sn"${T(`state-${k}-note`)}>${n}</div></div><span class="timer num"${T(`state-${k}-timer`)}>${tm}</span></div>`).join('')}</div>
    <div class="grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="card pad"${T('rule-colour')}><h3 style="font-size:14px;font-weight:500"${T('rule-colour-title')}>Colour is state, never decoration</h3><p class="desc" style="margin-top:6px"${T('rule-colour-body')}>Green while Claude works. Coral only when a session needs you now, on the card, its glow and its tab. Amber only for memory. Waiting on you is grey in charts, and turns coral on a session that needs you now.</p></div>
      <div class="card pad"${T('rule-ring')}><h3 style="font-size:14px;font-weight:500"${T('rule-ring-title')}>Rings</h3><p class="desc" style="margin-top:6px"${T('rule-ring-body')}>Outer: share of the session Claude was working. Middle: share waiting on you. Inner: tasks done, or agents done when there is no task list.</p></div>
      <div class="card pad"${T('rule-motion')}><h3 style="font-size:14px;font-weight:500"${T('rule-motion-title')}>Motion</h3><p class="desc" style="margin-top:6px"${T('rule-motion-body')}>Live dots pulse every 1.8 s, running agents spin and their wires flow. All of it stops under reduced motion; state still reads from colour and text.</p></div>
    </div>
    ${footBar({ updated: 'Spec sheet' })}</div>`;
}

// ======================================================================================================
// screen list and render
// ======================================================================================================
const SCREENS = [
  ['home--working', 'Home · working', 'The main view. A session with agents running.', o => homeWorking(o), 'st-run'],
  ['home--needs-you', 'Home · needs you', 'The green→coral switch. Where to answer, and what led here.', o => homeNeedsYou(o), 'st-you'],
  ['home--finished', 'Home · finished', 'The turn is over. What happened, totals, where the time went.', o => homeFinished(o), 'st-none'],
  ['home--stalled', 'Home · stalled', 'Nothing running and not waiting on you. A flat heartbeat.', o => homeStalled(o), 'st-none'],
  ['home--memory-warning', 'Home · memory warning', 'Past 75%: the banner, and runs wait their turn.', o => homeWorking({ ...o, memWarn: true }), 'st-warn'],
  ['memory', 'Memory', 'What is using memory, Claude\'s runs, and what proof stopped.', o => memoryScreen(o), 'st-warn'],
  ['job', 'Agent drill-down', 'One agent: what it is doing, its steps, every tool call, its brief.', o => jobScreen(o), 'st-run'],
  ['drawer--timeline', 'Drawer · timeline', 'One lane per worktree on a shared clock, with commits and gate failures.', o => drawerTimeline(o), 'st-run'],
  ['drawer--time', 'Drawer · where the time went', 'The split, the categories, and what slowed it down.', o => drawerTime(o), 'st-run'],
  ['drawer--log', 'Drawer · log', 'Events, gate, commits, problems, every tool call.', o => drawerLog(o), 'st-run'],
  ['switcher--menu', 'Switcher · menu', 'Ctrl K. Needs-you first, then by project.', o => switcher(o), 'st-run'],
  ['switcher--menu-search', 'Switcher · search', 'Typing filters sessions and projects.', o => switcher(o, 'eap'), 'st-run'],
  ['switcher--hidden-needs-you', 'Switcher · hidden needs you', 'A needs-you session past the visible tabs still shows, on "+4 more".', o => homeWorking({ ...o, tabs: ['checkout', 'dash', 'release', 'docs'], hiddenYou: true }), 'st-run'],
  ['loading', 'Loading', 'First load, before the feed arrives.', o => loading(o), 'st-none'],
  ['offline', 'Offline', 'The monitor stopped. The last update stays, dimmed.', o => offline(o), 'st-none'],
  ['empty', 'Empty', 'No sessions in the window.', o => empty(o), 'st-none'],
  ['status--all', 'Spec · status card states', 'Every status the card can show, and the rules behind colour and motion.', o => statusAll(o), 'st-none'],
];
const root = document.getElementById('screens');
for (const [id, name, note, fn, st] of SCREENS) {
  const pair = document.createElement('div'); pair.className = 'pair';
  pair.innerHTML = `<div class="lbl">${name}<code>${id}</code><span>${note}</span></div>` + ['light', 'dark'].map(th => `<div class="frame ${th} ${st}" data-screen="${id}${th === 'dark' ? '--dark' : ''}">${fn({ dark: th === 'dark' })}</div>`).join('');
  root.appendChild(pair);
}
// size-dependent charts
document.querySelectorAll('[data-graph]').forEach(g => { g.innerHTML = jobGraph([...CK.agents.filter(a => !a.end), ...CK.agents.filter(a => a.end)], g.clientWidth, +g.dataset.h, { gate: { pass: 7, total: 8, fail: true }, mainBadge: 'waiting on 3' }); });
document.querySelectorAll('[data-chart]').forEach(c => { c.innerHTML = activityChart(JSON.parse(c.dataset.segs), +c.dataset.t0, +c.dataset.t1, c.clientWidth, c.clientHeight, { bucket: +c.dataset.bucket, id: c.dataset.chart }); });
document.querySelectorAll('[data-memchart]').forEach(c => { c.innerHTML = memoryChart(c.clientWidth, c.clientHeight); });
document.querySelectorAll('[data-waterfall]').forEach(c => { c.innerHTML = waterfall(c.clientWidth); });

const tip = document.createElement('div'); tip.className = 'tip'; tip.style.display = 'none'; document.body.appendChild(tip);
document.addEventListener('mousemove', e => { const t = e.target.closest('[data-tip]'); if (!t) { tip.style.display = 'none'; return; } tip.innerHTML = t.dataset.tip; tip.style.display = 'block'; tip.style.left = e.pageX + 14 + 'px'; tip.style.top = e.pageY + 14 + 'px'; });
})();
</script>
</body>
</html>
